name: CPF document worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum jobs to claim
        required: false
        default: "5"

concurrency:
  group: cpf-document-worker
  cancel-in-progress: false

jobs:
  process:
    if: vars.CPF_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product_dev/finder-worker/requirements.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y libreoffice poppler-utils libmagic1
      - run: pip install -r product_dev/finder-worker/requirements.txt
      - run: python product_dev/finder-worker/run.py --limit "${{ inputs.limit || '5' }}"
        env:
          SUPABASE_URL: https://tcvlnpgpuphdalzvmoyo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CPF_SUPABASE_SERVICE_ROLE_KEY }}
          CPF_AI_PROXY_URL: https://tcvlnpgpuphdalzvmoyo.supabase.co/functions/v1/cpf-ai-worker
          CPF_ROUTINE_MODEL: gpt-5.6-luna
          CPF_ESCALATION_MODEL: gpt-5.6-terra
