name: Product Dev device reminders

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due-date and annual inventory reminders
        env:
          DEVICE_API_KEY: ${{ secrets.CPF_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "apikey: ${DEVICE_API_KEY}" \
            https://tcvlnpgpuphdalzvmoyo.supabase.co/functions/v1/pd-device-reminders
