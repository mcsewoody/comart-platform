name: Product Dev document worker v2

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Document library
        required: true
        type: choice
        options: [both, mfg, buy]
        default: both
      limit:
        description: Maximum jobs per library
        required: false
        default: "20"
      max_batches:
        description: Consecutive batches for this manual run
        required: false
        default: "1"

concurrency:
  group: pd-document-worker-v2
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product_dev/finder-worker/requirements.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y libreoffice poppler-utils libmagic1
      - run: pip install -r product_dev/finder-worker/requirements.txt
      - name: Process bounded batches
        run: |
          if ! [[ "$MAX_BATCHES" =~ ^[0-9]+$ ]] || (( MAX_BATCHES < 1 || MAX_BATCHES > 20 )); then
            echo "max_batches must be between 1 and 20"
            exit 1
          fi
          for ((batch = 1; batch <= MAX_BATCHES; batch++)); do
            echo "Processing batch ${batch}/${MAX_BATCHES}"
            if ! python -m pd_worker.run --dataset "$DATASET" --limit "$LIMIT"; then
              echo "::warning::Batch ${batch} contained failed documents; continuing so later jobs are not blocked."
            fi
          done
        working-directory: product_dev/finder-worker
        env:
          DATASET: ${{ inputs.dataset }}
          LIMIT: ${{ inputs.limit }}
          MAX_BATCHES: ${{ inputs.max_batches }}
          SUPABASE_URL: https://tcvlnpgpuphdalzvmoyo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CPF_SUPABASE_SERVICE_ROLE_KEY }}
          PD_AI_PROXY_URL: https://tcvlnpgpuphdalzvmoyo.supabase.co/functions/v1/pd-ai-worker
          PD_ROUTINE_MODEL: gpt-5.6-luna
