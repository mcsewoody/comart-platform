name: Product Dev document worker v2

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Document library
        required: true
        type: choice
        options: [both, mfg, buy]
        default: both
      limit:
        description: Maximum jobs per library
        required: false
        default: "20"

concurrency:
  group: pd-document-worker-v2
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: product_dev/finder-worker/requirements.txt
      - run: sudo apt-get update
      - run: sudo apt-get install -y libreoffice poppler-utils libmagic1
      - run: pip install -r product_dev/finder-worker/requirements.txt
      - run: python -m pd_worker.run --dataset "${{ inputs.dataset }}" --limit "${{ inputs.limit }}"
        working-directory: product_dev/finder-worker
        env:
          SUPABASE_URL: https://tcvlnpgpuphdalzvmoyo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CPF_SUPABASE_SERVICE_ROLE_KEY }}
          PD_AI_PROXY_URL: https://tcvlnpgpuphdalzvmoyo.supabase.co/functions/v1/pd-ai-worker
          PD_ROUTINE_MODEL: gpt-5.6-luna
