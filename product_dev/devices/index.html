<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>COMART 手機與配件 v1.08</title>
  <meta name="theme-color" content="#080c14">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{--bg:#080c14;--panel:#0e1728;--panel2:#121e33;--line:#263b5b;--text:#f4f7fb;--muted:#91a3bd;--accent:#16cee5;--blue:#2d7ff9;--green:#38d996;--yellow:#f5c451;--red:#ff6b76;--shadow:0 18px 55px #0008;--r:18px}
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:radial-gradient(circle at 80% -20%,#17314a 0,transparent 35%),var(--bg);color:var(--text);font-family:DM Sans,Inter,"PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}:focus-visible{outline:3px solid #62eaff;outline-offset:3px}
    .top{position:sticky;top:0;z-index:20;height:72px;background:#080c14e8;backdrop-filter:blur(18px);border-bottom:1px solid #1d2d45;display:flex;align-items:center;gap:14px;padding:0 max(20px,calc((100vw - 1500px)/2));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}.back,.icon-btn,.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#101a2b;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;font-weight:750}.back:hover,.icon-btn:hover,.btn:hover{border-color:#4d6d99;background:#17243a}.brand{display:flex;align-items:center;gap:11px;min-width:0}.mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#10647a,#07364d);color:#62ecff;display:grid;place-items:center}.brand b{display:block;font-size:17px;white-space:nowrap}.brand small{display:block;color:var(--muted);font-weight:700;letter-spacing:.12em;margin-top:3px}.grow{flex:1}.user{text-align:right}.user b{display:block;font-size:13px}.user small{color:var(--muted)}
    .shell{max-width:1500px;margin:auto;padding:28px 24px 70px}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:25px}.eyebrow{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.2em}.hero h1{font-size:clamp(30px,4vw,48px);letter-spacing:-.045em;margin:7px 0}.hero p{color:var(--muted);margin:0;line-height:1.65}.btn.primary{border-color:#0bd6ef;background:var(--accent);color:#04202a}.btn.danger{border-color:#743543;color:#ffb0b7;background:#29121a}.btn.good{border-color:#227050;color:#7ef0ba;background:#102820}.btn.small{min-height:36px;padding:0 12px;font-size:12px}.btn[disabled]{opacity:.45;cursor:not-allowed}
    .scope-switch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 24px;padding:7px;background:#0a1322;border:1px solid var(--line);border-radius:18px}.scope-btn{min-height:68px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted);font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}.scope-btn.active{color:#07141d;background:linear-gradient(135deg,#4de7e0,#16cee5);box-shadow:0 8px 24px #00cce52a}.scope-btn:not(.active):hover{background:#142238;color:var(--text);border-color:#304866}
    .tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow:auto}.tab{position:relative;background:none;border:0;color:var(--muted);padding:15px 18px;font-weight:850;white-space:nowrap}.tab.active{color:var(--text)}.tab.active:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:20px;background:#233550;color:#cfdbec;font-size:11px}.badge.hot{background:#5b201f;color:#ffb8b6}
    .filters{display:grid;grid-template-columns:minmax(240px,1fr) repeat(3,minmax(145px,190px));gap:10px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:#a9bad0;font-weight:800}.control{width:100%;min-height:46px;padding:10px 13px;color:var(--text);background:#0d1727;border:1px solid var(--line);border-radius:12px}.search{position:relative}.search i{position:absolute;left:14px;top:15px;color:var(--muted)}.search input{padding-left:44px}
    .summary{display:flex;justify-content:space-between;align-items:center;margin:10px 0 15px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:linear-gradient(160deg,#111e32,#0d1626);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;transition:.18s transform,.18s border-color;box-shadow:0 8px 26px #0002}.card:hover{transform:translateY(-2px);border-color:#3e6387}.card-image{aspect-ratio:16/10;background:#07101d;display:grid;place-items:center;overflow:hidden;position:relative}.card-image img{width:100%;height:100%;object-fit:contain;background:#fff}.placeholder{font-size:44px;color:#44617e}.status{position:absolute;left:12px;top:12px;padding:5px 9px;border-radius:999px;background:#0b1524dd;border:1px solid #ffffff20;font-size:11px;font-weight:850}.s-available{color:#65ecb3}.s-in_use{color:#72c3ff}.s-maintenance{color:#ffd77d}.s-lost,.s-retired{color:#ff929d}.card-body{padding:16px}.code{font-family:DM Mono,monospace;color:var(--accent);font-weight:900;letter-spacing:.12em;font-size:12px}.card h3{margin:8px 0 5px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:13px;color:var(--muted);min-height:38px}.meta{border-top:1px solid #22334d;margin-top:13px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#b6c4d6}.custodian{font-size:15px;font-weight:900;color:#f4f7fb}.card-actions{display:grid;grid-template-columns:1.08fr .92fr;gap:8px;margin-top:13px}.card-actions .btn{width:100%;position:relative;z-index:2;padding:0 8px}.btn.borrow-cta,.btn.transfer-cta{min-height:48px;font-size:14px;font-weight:950}.btn.borrow-cta{border:1px solid #7df7ff;background:linear-gradient(135deg,#53f3e4,#1bcde8);color:#031820;box-shadow:0 9px 24px #10dbea40}.btn.borrow-cta:hover{border-color:#fff;background:linear-gradient(135deg,#8affed,#35ddff);transform:translateY(-1px)}.btn.transfer-cta{border:1px solid #8bbdff;background:linear-gradient(135deg,#246acb,#5b74e8);color:#fff;box-shadow:0 9px 24px #3c6fe03d}.btn.transfer-cta:hover{border-color:#cfe4ff;background:linear-gradient(135deg,#347fe2,#6e84f2);transform:translateY(-1px)}.btn.borrow-cta[disabled],.btn.transfer-cta[disabled]{background:#16243a;color:#71839b;border-color:#2d405d;box-shadow:none;transform:none}.custodian-fact{border-color:#2d7790;background:linear-gradient(135deg,#10283a,#111d30);font-size:18px;font-weight:900}.custodian-fact small{font-size:12px;font-weight:700}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;background:#0d1725;border:1px dashed #334968;border-radius:var(--r);color:var(--muted)}.loadmore{display:block;margin:24px auto 0}.hidden{display:none!important}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}.pending-list{display:grid;gap:12px}.pending-item{display:flex;align-items:center;gap:15px;border:1px solid #263956;border-radius:14px;padding:15px;background:#0b1525}.pending-item .main{flex:1;min-width:0}.pending-item h3{margin:0 0 5px}.pending-item p{margin:0;color:var(--muted);font-size:13px}.warn{color:var(--yellow);font-size:12px;font-weight:800}.manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.type-row{display:grid;grid-template-columns:50px 1fr 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #21314a}.type-code{font-family:DM Mono;font-size:18px;color:var(--accent)}
    .personal-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.personal-head h2{font-size:25px;margin:0 0 6px}.personal-head p{margin:0;color:var(--muted);line-height:1.6}.personal-filters{display:grid;grid-template-columns:minmax(260px,1fr) 190px auto auto;align-items:center;gap:10px;margin-bottom:16px}.checkline{display:flex;align-items:center;gap:8px;color:#b9c7d8;font-size:13px;white-space:nowrap}.owner-line{display:flex;align-items:center;gap:9px;border-top:1px solid #22334d;margin-top:13px;padding-top:12px}.owner-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#203552;color:#78e9f5;font-size:12px;font-weight:900}.owner-line b{display:block;font-size:12px}.owner-line small{color:var(--muted);font-size:11px}.personal-card .sub{min-height:auto}.personal-actions{display:flex;gap:7px;margin-top:13px}.personal-actions .btn{flex:1;padding:0 9px}
    .overlay{position:fixed;inset:0;background:#02060dcc;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:5vh 18px;overflow:auto}.overlay.open{display:flex}.modal{width:min(920px,100%);background:#0d1727;border:1px solid #345074;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.modal-head{position:sticky;top:0;z-index:3;background:#0d1727f2;backdrop-filter:blur(15px);display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;flex:1;font-size:22px}.close{width:44px;padding:0}.modal-body{padding:22px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form-grid .wide{grid-column:1/-1}.required:after{content:" *";color:var(--red)}textarea.control{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}.detail-hero{display:grid;grid-template-columns:280px 1fr;gap:22px}.detail-image{aspect-ratio:1;background:#07101d;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;overflow:hidden}.detail-image img{width:100%;height:100%;object-fit:contain;background:#fff}.detail-title h2{font-size:30px;margin:8px 0}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:#1a2a43;color:#c9d5e5;font-size:12px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.fact{background:#111d30;border:1px solid #243752;border-radius:12px;padding:12px}.fact small{display:block;color:var(--muted);margin-bottom:5px}.sections{display:grid;gap:14px}.section{border:1px solid #263a57;border-radius:15px;overflow:hidden}.section summary{cursor:pointer;padding:15px 17px;font-weight:850;background:#101c2e}.section .inside{padding:16px}.history{display:grid;gap:9px}.history-row{border-left:3px solid #2b5875;padding:8px 12px;background:#0a1422}.history-row small{color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;z-index:90;max-width:390px;background:#16243a;border:1px solid #40628b;border-radius:13px;padding:13px 16px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.toast.err{border-color:#8d3949;color:#ffc0c6}.live{min-height:20px;color:var(--muted);font-size:13px;margin:8px 0}
    @media(max-width:1120px){.grid{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr}.manage-grid{grid-template-columns:1fr}}
    @media(max-width:760px){.top{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}.brand small,.user{display:none}.shell{padding:20px 14px 70px}.hero{align-items:flex-start}.hero p{font-size:14px}.btn.primary{padding:0 13px}.scope-btn{min-height:56px;font-size:15px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.personal-head{align-items:flex-start;flex-direction:column}.personal-filters{grid-template-columns:1fr 1fr}.personal-filters .search{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.card-body{padding:12px}.card h3{font-size:15px}.meta{display:block}.meta span{display:block;margin-top:5px}.form-grid,.detail-hero{grid-template-columns:1fr}.detail-image{max-width:360px;width:100%;margin:auto}.facts{grid-template-columns:1fr 1fr}.modal-body{padding:16px}.overlay{padding:0}.modal{min-height:100%;border-radius:0}.pending-item{align-items:flex-start;flex-wrap:wrap}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.filters .search{grid-column:auto}.hero h1{font-size:29px}.hero{gap:10px}.back span{display:none}.facts{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <a class="sr-only" href="#main">跳至主要內容</a>
  <header class="top">
    <a class="back" id="backLink" href="../index.html"><i data-lucide="arrow-left" width="18"></i><span>Product Dev</span></a>
    <div class="brand"><div class="mark"><i data-lucide="smartphone" width="22"></i></div><div><b>手機與配件</b><small>DEVICE CUSTODY · v1.08</small></div></div>
    <div class="grow"></div><div class="user"><b id="userName">驗證中…</b><small id="userMeta"></small></div>
  </header>
  <main class="shell" id="main">
    <section class="hero"><div><span class="eyebrow">PRODUCT DEVELOPMENT</span><h1>手機與配件</h1><p>公司資產依流程管理；個人資產由同事自行登錄與維護。</p></div><button class="btn primary" id="newBtn"><i data-lucide="plus"></i>新增公司設備</button></section>
    <nav class="scope-switch" aria-label="資產大類"><button class="scope-btn active" id="companyScope"><i data-lucide="building-2"></i>公司資產</button><button class="scope-btn" id="personalScope"><i data-lucide="user-round"></i>個人資產</button></nav>
    <div id="companyArea">
    <nav class="tabs" role="tablist" aria-label="手機與配件功能">
      <button class="tab active" role="tab" data-tab="list">設備清單</button>
      <button class="tab" role="tab" data-tab="pending">待我確認<span class="badge" id="pendingBadge">0</span></button>
      <button class="tab hidden" role="tab" data-tab="manage" id="manageTab">管理</button>
    </nav>
    <section id="view-list">
      <div class="filters">
        <div class="search"><i data-lucide="search" width="18"></i><label class="sr-only" for="q">搜尋設備</label><input class="control" id="q" placeholder="資產編號、品牌、型號、序號、保管人…"></div>
        <select class="control" id="typeFilter" aria-label="設備類型"><option value="">所有類型</option></select>
        <select class="control" id="statusFilter" aria-label="設備狀態"><option value="">所有狀態</option><option value="available">可借用</option><option value="in_use">使用中</option><option value="maintenance">維修中</option><option value="lost">遺失／遭竊</option></select>
        <select class="control" id="ownerFilter" aria-label="資產歸屬"><option value="">所有歸屬單位</option></select>
      </div>
      <label style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:8px"><input type="checkbox" id="includeRetired"> 顯示已退役設備</label>
      <div class="summary"><span id="totalText">讀取中…</span><span id="resultHint"></span></div>
      <div class="grid" id="cards" aria-live="polite"></div><button class="btn loadmore hidden" id="loadMore">載入下 30 筆</button>
    </section>
    <section id="view-pending" class="hidden"><div class="panel"><h2>待處理</h2><p style="color:var(--muted)">設備資料與保管權移轉分開確認，不會因資料缺漏阻擋舊設備啟用。</p><div class="pending-list" id="pendingList"></div></div></section>
    <section id="view-manage" class="hidden"><div class="manage-grid"><div class="panel"><h2>設備類型</h2><div id="typeRows"></div><div class="actions" style="justify-content:flex-start"><button class="btn small" id="addTypeBtn">新增類型</button></div></div><div class="panel"><h2>最近稽核紀錄</h2><div class="history" id="auditRows"></div></div></div></section>
    </div>
    <section id="personalArea" class="hidden">
      <div class="personal-head"><div><h2>個人資產調查</h2><p>登錄即代表同事可聯絡詢問借用；是否出借仍由擁有人自行決定。</p></div><button class="btn primary" id="personalNewBtn"><i data-lucide="plus"></i>登錄我的資產</button></div>
      <div class="personal-filters">
        <div class="search"><i data-lucide="search" width="18"></i><label class="sr-only" for="personalQ">搜尋個人資產</label><input class="control" id="personalQ" placeholder="品牌、型號、顏色、擁有人…"></div>
        <select class="control" id="personalType" aria-label="個人資產類型"><option value="">所有類型</option></select>
        <label class="checkline"><input type="checkbox" id="personalMine"> 只看我的</label>
        <label class="checkline hidden" id="personalInactiveWrap"><input type="checkbox" id="personalInactive"> 顯示離職／停權資料</label>
      </div>
      <div class="summary"><span id="personalTotal">共 0 筆</span><span>只顯示自願登錄資料</span></div>
      <div class="grid" id="personalCards" aria-live="polite"></div><button class="btn loadmore hidden" id="personalMore">載入下 30 筆</button>
    </section>
  </main>

  <div class="overlay" id="formOverlay" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="modal"><div class="modal-head"><h2 id="formTitle">新增設備</h2><button class="icon-btn close" data-close="formOverlay" aria-label="關閉"><i data-lucide="x"></i></button></div><form class="modal-body" id="assetForm"><div class="form-grid">
    <div class="field"><label class="required" for="fType">設備類型</label><select class="control" id="fType" required></select></div>
    <div class="field"><label class="required" for="fBrand">品牌</label><input class="control" id="fBrand" required></div>
    <div class="field wide"><label class="required" for="fModel">型號或名稱</label><input class="control" id="fModel" required></div>
    <div class="field"><label for="fOfficial">原廠代號</label><input class="control" id="fOfficial"></div><div class="field"><label for="fColor">顏色</label><input class="control" id="fColor"></div>
    <div class="field"><label for="fSerial">原廠序號</label><input class="control" id="fSerial"></div><div class="field"><label for="fImei">IMEI 1（手機）</label><input class="control" id="fImei"></div>
    <div class="field"><label class="required" for="fOwner">資產歸屬單位</label><select class="control" id="fOwner" required></select></div><div class="field"><label class="required" for="fCustodian">初始保管人</label><select class="control" id="fCustodian" required></select></div>
    <div class="field"><label for="fAmount">採購金額</label><input class="control" id="fAmount" type="number" min="0" step="0.01"></div><div class="field"><label for="fCurrency">幣別</label><select class="control" id="fCurrency"><option>NTD</option><option>USD</option><option>CNY</option><option>HKD</option><option>VND</option></select></div>
    <div class="field"><label for="fCountry">採購國家／地區</label><input class="control" id="fCountry"></div><div class="field"><label for="fVendor">商店／供應商</label><input class="control" id="fVendor"></div>
    <div class="field wide"><label for="fNote">來源與備註</label><textarea class="control" id="fNote"></textarea></div>
  </div><div class="live" id="formLive" aria-live="polite"></div><div class="actions"><button type="button" class="btn" data-close="formOverlay">取消</button><button class="btn primary" type="submit">建立並尋找官方圖片</button></div></form></div></div>

  <div class="overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-labelledby="detailHeading"><div class="modal"><div class="modal-head"><h2 id="detailHeading">設備詳情</h2><button class="icon-btn close" data-close="detailOverlay" aria-label="關閉"><i data-lucide="x"></i></button></div><div class="modal-body" id="detailBody"></div></div></div>
  <div class="overlay" id="actionOverlay" role="dialog" aria-modal="true" aria-labelledby="actionTitle"><div class="modal" style="width:min(650px,100%)"><div class="modal-head"><h2 id="actionTitle">處理設備</h2><button class="icon-btn close" data-close="actionOverlay"><i data-lucide="x"></i></button></div><form class="modal-body" id="actionForm"><div id="actionFields" class="form-grid"></div><div class="actions"><button type="button" class="btn" data-close="actionOverlay">取消</button><button class="btn primary" type="submit">確認送出</button></div></form></div></div>
  <div class="overlay" id="personalFormOverlay" role="dialog" aria-modal="true" aria-labelledby="personalFormTitle"><div class="modal" style="width:min(650px,100%)"><div class="modal-head"><h2 id="personalFormTitle">登錄我的個人資產</h2><button class="icon-btn close" data-close="personalFormOverlay"><i data-lucide="x"></i></button></div><form class="modal-body" id="personalForm"><input type="hidden" id="personalId"><div class="form-grid"><div class="field"><label class="required" for="personalFormType">設備類型</label><select class="control" id="personalFormType" required></select></div><div class="field"><label class="required" for="personalBrand">品牌</label><input class="control" id="personalBrand" required maxlength="120"></div><div class="field"><label class="required" for="personalModel">型號</label><input class="control" id="personalModel" required maxlength="200"></div><div class="field"><label for="personalColor">顏色</label><input class="control" id="personalColor" maxlength="80"></div></div><p class="sub" style="min-height:0;margin-top:16px">儲存後立即顯示，官方圖片會在背景補上；找不到時可自行上傳。</p><div class="actions"><button type="button" class="btn" data-close="personalFormOverlay">取消</button><button class="btn primary" type="submit">儲存</button></div></form></div></div>
  <input class="hidden" id="personalImageInput" type="file" accept="image/jpeg,image/png,image/webp">

<script>
const API='https://tcvlnpgpuphdalzvmoyo.supabase.co/functions/v1/pd-devices-api',KEY='comart-portal-session';let S=null,B=null,items=[],offset=0,total=0,current=null,actionHandler=null,loadSeq=0,scope='company',personalItems=[],personalOffset=0,personalTotal=0,personalSeq=0,personalImageId=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function decode(v){try{return JSON.parse(decodeURIComponent(escape(atob(v))))}catch{return null}}
function toast(msg,err=false){const e=$('#toast');e.textContent=msg;e.className='toast show'+(err?' err':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',4500)}
async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-session':S.sig},body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({error:'invalid_response'}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}
function open(id){$('#'+id).classList.add('open');setTimeout(()=>$('#'+id).querySelector('button,input,select')?.focus(),20)}function close(id){$('#'+id).classList.remove('open')}
function fmtDate(v){return v?new Date(v).toLocaleDateString('zh-TW'):'—'}function fmtMoney(a,c){return a==null?'—':`${c||''} ${Number(a).toLocaleString()}`}
const statusName={available:'可借用',in_use:'使用中',maintenance:'維修中',lost:'遺失／遭竊',retired:'已退役'},purposeName={borrow:'借用',product_test:'產品測試',production:'生產需求',maintenance:'維修',other:'其他',return:'歸還'},conditionName={normal:'正常',used:'有使用痕跡',damaged:'有損壞',missing_accessory:'配件缺少'};
function session(){const q=new URLSearchParams(location.search);S=q.get('_ps')?decode(q.get('_ps')):null;if(S?.sig)localStorage.setItem(KEY,JSON.stringify(S));if(!S)try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(q.has('_ps')){q.delete('_ps');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''))}if(!S?.sig||!S.empId||S.expires&&Date.now()>S.expires){location.href='../index.html';return false}return true}
async function init(){if(!session())return;B=await api('bootstrap');$('#userName').textContent=B.profile.name;$('#userMeta').textContent=(B.profile.role==='admin'?'管理員':'使用者')+' · '+B.profile.empId;$('#pendingBadge').textContent=B.badges.pendingForMe;if(B.profile.role==='admin'){$('#manageTab').classList.remove('hidden');$('#personalInactiveWrap').classList.remove('hidden')}fillOptions();renderTypes();const assetCode=new URLSearchParams(location.search).get('asset');if(assetCode)$('#q').value=assetCode;await load(true);if(assetCode){const exact=items.find(x=>x.assetCode.toUpperCase()===assetCode.toUpperCase());if(exact)await showDetail(exact.id)}lucide.createIcons()}
function fillOptions(){const ts=B.types.map(t=>`<option value="${esc(t.code)}">${esc(t.name_zh)} · ${esc(t.code)}xxx</option>`).join('');$('#fType').innerHTML=ts;$('#typeFilter').innerHTML='<option value="">所有類型</option>'+ts;$('#personalType').innerHTML='<option value="">所有類型</option>'+B.types.map(t=>`<option value="${esc(t.code)}">${esc(t.name_zh)}</option>`).join('');$('#personalFormType').innerHTML=B.types.map(t=>`<option value="${esc(t.code)}">${esc(t.name_zh)}</option>`).join('');const users=B.users.map(u=>`<option value="${esc(u.emp_id)}">${esc(u.name_zh||u.name_en||u.emp_id)} · ${esc(u.emp_id)}</option>`).join('');$('#fCustodian').innerHTML=users;$('#fCustodian').value=B.profile.empId;const units=[...new Map([...B.departments,...B.sites].map(x=>[(x.zh||x.en||x.key),x])).values()].map(x=>x.zh||x.en||x.key);$('#fOwner').innerHTML=units.map(x=>`<option>${esc(x)}</option>`).join('');$('#ownerFilter').innerHTML='<option value="">所有歸屬單位</option>'+units.map(x=>`<option>${esc(x)}</option>`).join('')}
async function load(reset=false){const seq=++loadSeq;if(reset){offset=0;items=[];$('#cards').innerHTML='<div class="empty">讀取中…</div>'}try{const j=await api('list',{query:$('#q').value,typeCode:$('#typeFilter').value,status:$('#statusFilter').value,owner:$('#ownerFilter').value,includeRetired:$('#includeRetired').checked,limit:30,offset});if(seq!==loadSeq)return;total=j.total;items.push(...j.items);offset=items.length;renderCards();$('#loadMore').classList.toggle('hidden',offset>=total)}catch(e){if(seq===loadSeq)$('#cards').innerHTML=`<div class="empty">讀取失敗：${esc(e.message)}</div>`}}
function renderCards(){$('#totalText').textContent=`共 ${total} 筆，已顯示 ${items.length} 筆`;$('#resultHint').textContent=$('#q').value?'依命中率排序':'可借用設備優先';$('#cards').innerHTML=items.length?items.map(a=>{const canRequest=!['maintenance','lost','retired'].includes(a.status);const reason=statusName[a.status]||'暫不可申請';return`<article class="card" tabindex="0" data-id="${a.id}" aria-label="開啟 ${esc(a.assetCode)} ${esc(a.brand)} ${esc(a.model)}"><div class="card-image">${a.imageUrl?`<img src="${esc(a.imageUrl)}" alt="${esc(a.brand+' '+a.model)}">`:'<i data-lucide="smartphone" class="placeholder"></i>'}<span class="status s-${a.status}">${statusName[a.status]||a.status}</span></div><div class="card-body"><span class="code">${esc(a.assetCode)}</span><h3>${esc(a.brand)} ${esc(a.model)}</h3><div class="sub">${esc(a.color||'顏色未填')} · ${esc(B.types.find(t=>t.code===a.typeCode)?.name_zh||a.typeCode)}</div><div class="meta"><span class="custodian">保管：${esc(a.custodianName||'尚未連結')}</span><span>${a.expectedAvailableDate?'預計 '+fmtDate(a.expectedAvailableDate):''}</span></div><div class="card-actions"><button class="btn borrow-cta borrow-btn" data-id="${a.id}" ${canRequest?'':'disabled'}><i data-lucide="hand"></i>${canRequest?'申請借用':esc(reason)}</button><button class="btn transfer-cta transfer-btn" data-id="${a.id}" ${canRequest?'':'disabled'}><i data-lucide="repeat-2"></i>設備移轉</button></div></div></article>`}).join(''):'<div class="empty">沒有符合條件的設備</div>';$$('.card').forEach(c=>{c.onclick=()=>showDetail(c.dataset.id);c.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target===c){e.preventDefault();showDetail(c.dataset.id)}}});$$('.borrow-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();borrowFromCard(b.dataset.id)});$$('.transfer-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();transferFromCard(b.dataset.id)});lucide.createIcons()}
async function personalLoad(reset=false){const seq=++personalSeq;if(reset){personalOffset=0;personalItems=[];$('#personalCards').innerHTML='<div class="empty">讀取中…</div>'}try{const j=await api('personalList',{query:$('#personalQ').value,typeCode:$('#personalType').value,mine:$('#personalMine').checked,includeInactive:$('#personalInactive').checked,limit:30,offset:personalOffset});if(seq!==personalSeq)return;personalTotal=j.total;personalItems.push(...j.items);personalOffset=personalItems.length;renderPersonalCards();$('#personalMore').classList.toggle('hidden',personalOffset>=personalTotal)}catch(e){if(seq===personalSeq)$('#personalCards').innerHTML=`<div class="empty">讀取失敗：${esc(e.message)}</div>`}}
function renderPersonalCards(){$('#personalTotal').textContent=`共 ${personalTotal} 筆，已顯示 ${personalItems.length} 筆`;$('#personalCards').innerHTML=personalItems.length?personalItems.map(a=>{const canDelete=a.isMine||B.profile.role==='admin';const place=[a.ownerDept,a.ownerSite].filter(Boolean).join(' · ')||'部門／據點未設定';return`<article class="card personal-card"><div class="card-image">${a.imageUrl?`<img src="${esc(a.imageUrl)}" alt="${esc(a.brand+' '+a.model)}">`:'<i data-lucide="image" class="placeholder"></i>'}${a.ownerActive?'':'<span class="status s-retired">帳號已停用</span>'}</div><div class="card-body"><span class="code">${esc(B.types.find(t=>t.code===a.typeCode)?.name_zh||a.typeCode)}</span><h3>${esc(a.brand)} ${esc(a.model)}</h3><div class="sub">${esc(a.color||'顏色未填')}</div><div class="owner-line"><span class="owner-avatar">${esc((a.ownerName||'?').slice(0,1))}</span><span><b>${esc(a.ownerName)}</b><small>${esc(place)}</small></span></div>${a.isMine||canDelete?`<div class="personal-actions">${a.isMine?`<button class="btn small" onclick="editPersonal('${a.id}')">編輯</button><button class="btn small" onclick="choosePersonalImage('${a.id}')">換照片</button>`:''}${canDelete?`<button class="btn danger small" onclick="deletePersonal('${a.id}')">刪除</button>`:''}</div>`:''}</div></article>`}).join(''):'<div class="empty">尚無符合條件的個人資產</div>';lucide.createIcons()}
function switchScope(next){scope=next;const personal=next==='personal';$('#companyArea').classList.toggle('hidden',personal);$('#personalArea').classList.toggle('hidden',!personal);$('#companyScope').classList.toggle('active',!personal);$('#personalScope').classList.toggle('active',personal);$('#newBtn').classList.toggle('hidden',personal);if(personal)personalLoad(true);lucide.createIcons()}
function openPersonalForm(item=null){$('#personalForm').reset();$('#personalId').value=item?.id||'';$('#personalFormTitle').textContent=item?'編輯我的個人資產':'登錄我的個人資產';if(item){$('#personalFormType').value=item.typeCode;$('#personalBrand').value=item.brand;$('#personalModel').value=item.model;$('#personalColor').value=item.color||''}open('personalFormOverlay')}
function editPersonal(id){const item=personalItems.find(x=>x.id===id);if(item?.isMine)openPersonalForm(item)}
async function deletePersonal(id){const item=personalItems.find(x=>x.id===id);if(!item||!confirm(`永久刪除 ${item.brand} ${item.model}？資料與圖片都無法復原。`))return;try{await api('personalDelete',{id});toast('個人資產已永久刪除');await personalLoad(true)}catch(e){toast(e.message,true)}}
function choosePersonalImage(id){personalImageId=id;$('#personalImageInput').value='';$('#personalImageInput').click()}
async function showDetail(id){open('detailOverlay');$('#detailBody').innerHTML='<div class="empty">讀取中…</div>';try{current=await api('detail',{id});renderDetail()}catch(e){$('#detailBody').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function renderDetail(){const a=current.item,admin=B.profile.role==='admin',mine=a.custodianEmpId===B.profile.empId;$('#detailHeading').textContent=`${a.assetCode} · ${a.brand} ${a.model}`;const spec=Object.entries(a.specifications||{}).map(([k,v])=>`<div class="fact"><small>${esc(k)}</small>${esc(v)}</div>`).join('');const history=(current.transfers||[]).map(t=>`<div class="history-row"><b>${esc(purposeName[t.purpose]||t.purpose)} · ${esc(t.status)}</b><br><small>${fmtDate(t.requestedAt||t.requested_at)}｜${esc(t.from_emp_id||'—')} → ${esc(t.to_emp_id)}</small>${t.conflict_detected?'<div class="warn">時段衝突</div>':''}${t.transfer_type==='temporary'&&t.status==='accepted'&&t.to_emp_id===B.profile.empId?`<div><button class="btn small" onclick="requestReturn('${t.id}')">提出歸還</button></div>`:''}</div>`).join('')||'<span class="sub">尚無移轉紀錄</span>';const repairs=(current.repairs||[]).map(r=>`<div class="history-row"><b>${fmtDate(r.sent_on)} · ${esc(r.reason)}</b><br><small>${esc(r.vendor||'廠商未填')}｜${fmtMoney(r.cost,r.currency)}</small></div>`).join('')||'<span class="sub">尚無維修紀錄</span>';
$('#detailBody').innerHTML=`<div class="detail-hero"><div class="detail-image">${a.imageUrl?`<img src="${esc(a.imageUrl)}" alt="設備圖片">`:'<i data-lucide="image" class="placeholder"></i>'}</div><div class="detail-title"><span class="code">${esc(a.assetCode)}</span><h2>${esc(a.brand)} ${esc(a.model)}</h2><div class="pills"><span class="pill s-${a.status}">${statusName[a.status]}</span><span class="pill">${esc(B.types.find(t=>t.code===a.typeCode)?.name_zh||a.typeCode)}</span></div><div class="facts"><div class="fact custodian-fact"><small>保管人</small>${esc(a.custodianName||'未連結')}</div><div class="fact"><small>資產歸屬</small>${esc(a.ownershipUnit)}</div><div class="fact"><small>目前位置</small>${esc(a.currentLocation||'—')}</div><div class="fact"><small>原廠代號</small>${esc(a.officialModelCode||'—')}</div><div class="fact"><small>原廠序號</small>${esc(a.manufacturerSerial||'—')}</div><div class="fact"><small>IMEI</small>${esc(a.imei1||'—')}</div><div class="fact"><small>採購</small>${esc(fmtMoney(a.purchaseAmount,a.purchaseCurrency))}</div><div class="fact"><small>來源</small>${esc([a.purchaseCountry,a.purchaseVendor].filter(Boolean).join(' · ')||'—')}</div><div class="fact"><small>保固至</small>${fmtDate(a.warrantyExpiresOn)}</div></div>${a.missingFields?.length?`<div class="warn">待補：${esc(a.missingFields.join('、'))}</div>`:''}</div></div>
<div class="actions" style="justify-content:flex-start">${!['maintenance','lost','retired'].includes(a.status)?`<button class="btn borrow-cta" onclick="borrowDialog(current.item)"><i data-lucide="hand"></i>申請借用</button><button class="btn transfer-cta" onclick="transferDialog(current.item)"><i data-lucide="repeat-2"></i>設備移轉</button>`:''}${mine&&new Date().getMonth()===11?`<button class="btn good small" onclick="inventoryDialog()">年度盤點確認</button>`:''}${admin?`<button class="btn small" onclick="editDialog()">編輯核心資料</button>`:''}${admin||mine?`<button class="btn small" onclick="dailyDialog()">更新狀態</button><button class="btn small" onclick="repairDialog()">新增維修</button><button class="btn small" onclick="uploadDialog('image')">更換照片</button><button class="btn small" onclick="uploadDialog('receipt')">上傳發票／收據</button>`:''}${admin?`${a.status==='retired'||a.status==='lost'?'<button class="btn good small" onclick="restoreCurrent()">恢復使用</button>':'<button class="btn danger small" onclick="lostDialog()">遺失／遭竊</button><button class="btn danger small" onclick="retireDialog()">退役</button>'}`:''}</div>
<div class="sections" style="margin-top:20px">${a.receiptUrl?`<details class="section"><summary>採購單據</summary><div class="inside"><a class="btn small" href="${esc(a.receiptUrl)}" target="_blank" rel="noopener"><i data-lucide="file-text"></i>查看發票／收據</a></div></details>`:''}<details class="section" open><summary>設備規格</summary><div class="inside facts">${spec||'<span class="sub">尚未填寫規格</span>'}</div></details><details class="section"><summary>借用與保管歷史</summary><div class="inside history">${history}</div></details><details class="section"><summary>維修紀錄</summary><div class="inside history">${repairs}</div></details><details class="section"><summary>QR Code</summary><div class="inside"><div id="qr"></div><button class="btn small" onclick="window.print()" style="margin-top:12px">列印單張標籤</button></div></details>${a.imageSourceUrl?`<details class="section"><summary>圖片來源</summary><div class="inside"><a href="${esc(a.imageSourceUrl)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(a.imageSourceName||a.imageSourceUrl)}</a><p class="sub">取得日期：${fmtDate(a.imageRetrievedAt)}</p></div></details>`:''}</div>`;new QRCode($('#qr'),{text:`https://platform.comart.com.tw/product_dev/devices/?asset=${encodeURIComponent(a.assetCode)}`,width:140,height:140,colorDark:'#07101d',colorLight:'#ffffff'});lucide.createIcons()}
function actionDialog(title,html,handler){$('#actionTitle').textContent=title;$('#actionFields').innerHTML=html;actionHandler=handler;open('actionOverlay')}
function field(id,label,type='text',extra=''){return`<div class="field"><label for="${id}">${label}</label><input class="control" id="${id}" type="${type}" ${extra}></div>`}
function borrowDialog(item){const me=esc(B.profile.name||B.profile.empId);actionDialog(`申請借用 ${item.assetCode}`,`<div class="field wide"><label>申請設備</label><div class="control">${esc(item.brand)} ${esc(item.model)}</div></div><div class="field"><label>借用人</label><div class="control">${me}</div></div><div class="field"><label>用途</label><select class="control" id="aPurpose"><option value="borrow">借用</option><option value="product_test">產品測試</option><option value="production">生產需求</option><option value="maintenance">維修</option><option value="other">其他</option></select></div>${field('aStart','開始日','date','required')}${field('aDue','預計歸還日','date','required')}${field('aProject','客戶／專案／產品編號')}<div class="field wide"><label>用途說明</label><textarea class="control" id="aNote"></textarea></div>`,async()=>api('requestTransfer',{assetId:item.id,transferType:'temporary',toEmpId:B.profile.empId,purpose:$('#aPurpose').value,projectRef:$('#aProject').value,startsOn:$('#aStart').value,dueOn:$('#aDue').value,purposeNote:$('#aNote').value}))}
function transferDialog(item){const canChoose=B.profile.role==='admin'||item.custodianEmpId===B.profile.empId;const recipient=canChoose?`<div class="field"><label>新保管人</label><select class="control" id="aTo">${B.users.filter(u=>u.emp_id!==item.custodianEmpId).map(u=>`<option value="${esc(u.emp_id)}">${esc(u.name_zh||u.name_en||u.emp_id)}</option>`).join('')}</select></div>`:`<div class="field"><label>新保管人</label><div class="control">${esc(B.profile.name||B.profile.empId)}（本人）</div><input type="hidden" id="aTo" value="${esc(B.profile.empId)}"></div>`;actionDialog(`設備移轉 ${item.assetCode}`,`<div class="field wide"><label>移轉設備</label><div class="control">${esc(item.brand)} ${esc(item.model)}</div></div><div class="field"><label>目前保管人</label><div class="control">${esc(item.custodianName||'尚未連結')}</div></div>${recipient}<div class="field"><label>移轉原因</label><select class="control" id="aPurpose"><option value="product_test">產品測試</option><option value="production">生產需求</option><option value="maintenance">維修安排</option><option value="other">其他</option></select></div>${field('aProject','客戶／專案／產品編號')}<div class="field wide"><label>移轉說明（選其他時必填）</label><textarea class="control" id="aNote"></textarea></div><p class="wide sub" style="min-height:0">這是永久更換保管人，不設定歸還日；交付雙方確認後才會生效。</p>`,async()=>api('requestTransfer',{assetId:item.id,transferType:'permanent',toEmpId:$('#aTo').value,purpose:$('#aPurpose').value,projectRef:$('#aProject').value,purposeNote:$('#aNote').value}))}
async function borrowFromCard(id){try{const detail=await api('detail',{id});current=detail;borrowDialog(detail.item)}catch(e){toast(e.message,true)}}
async function transferFromCard(id){try{const detail=await api('detail',{id});current=detail;transferDialog(detail.item)}catch(e){toast(e.message,true)}}
function editDialog(){const a=current.item;actionDialog('編輯核心資料',`${field('aBrand','品牌','text','required value="'+esc(a.brand)+'"')}${field('aModel','正式型號','text','required value="'+esc(a.model)+'"')}${field('aOfficial','原廠代號','text','value="'+esc(a.officialModelCode||'')+'"')}${field('aSerial','原廠序號','text','value="'+esc(a.manufacturerSerial?.replace(/^••••/,'')||'')+'"')}${field('aImei','IMEI 1','text','value="'+esc(a.imei1?.replace(/^••••/,'')||'')+'"')}${field('aColor','顏色','text','value="'+esc(a.color||'')+'"')}<div class="field"><label>保管人</label><select class="control" id="aCust">${B.users.map(u=>`<option value="${esc(u.emp_id)}" ${u.emp_id===a.custodianEmpId?'selected':''}>${esc(u.name_zh||u.name_en||u.emp_id)}</option>`).join('')}</select></div><div class="field"><label>資產歸屬</label><select class="control" id="aOwner">${[...$('#fOwner').options].map(o=>`<option ${o.value===a.ownershipUnit?'selected':''}>${esc(o.value)}</option>`).join('')}</select></div>${field('aLoc','目前位置','text','value="'+esc(a.currentLocation||'')+'"')}${field('aAmount','採購金額','number','min="0" step="0.01" value="'+esc(a.purchaseAmount??'')+'"')}<div class="field"><label>幣別</label><select class="control" id="aCurr">${['NTD','USD','CNY','HKD','VND'].map(x=>`<option ${x===a.purchaseCurrency?'selected':''}>${x}</option>`).join('')}</select></div>${field('aCountry','採購國家／地區','text','value="'+esc(a.purchaseCountry||'')+'"')}${field('aVendor','商店／供應商','text','value="'+esc(a.purchaseVendor||'')+'"')}`,async()=>api('update',{id:a.id,brand:$('#aBrand').value,model:$('#aModel').value,officialModelCode:$('#aOfficial').value,manufacturerSerial:$('#aSerial').value,imei1:$('#aImei').value,color:$('#aColor').value,custodianEmpId:$('#aCust').value,ownershipUnit:$('#aOwner').value,currentLocation:$('#aLoc').value,purchaseAmount:$('#aAmount').value,purchaseCurrency:$('#aCurr').value,purchaseCountry:$('#aCountry').value,purchaseVendor:$('#aVendor').value}))}
function dailyDialog(){actionDialog('更新設備狀態',`<div class="field"><label>狀態</label><select class="control" id="aStatus"><option value="available">可借用</option><option value="in_use">使用中</option><option value="maintenance">維修中</option></select></div>${field('aExpected','預計可用日','date')}<div class="field wide"><label>狀況備註</label><textarea class="control" id="aCondition">${esc(current.item.conditionNote||'')}</textarea></div>`,async()=>api('update',{id:current.item.id,status:$('#aStatus').value,expectedAvailableDate:$('#aExpected').value,conditionNote:$('#aCondition').value}))}
function repairDialog(){actionDialog('新增維修紀錄',`${field('aSent','送修日期','date','required') }<div class="field wide"><label>送修原因</label><textarea class="control" id="aReason" required></textarea></div>${field('aVendor','維修廠商')}${field('aCost','費用','number','min="0" step="0.01"')}<div class="field"><label>幣別</label><select class="control" id="aCurrency"><option>NTD</option><option>USD</option><option>CNY</option><option>HKD</option><option>VND</option></select></div>${field('aReturned','取回日期','date')}<div class="field wide"><label>維修結果</label><textarea class="control" id="aResult"></textarea></div>`,async()=>api('addRepair',{assetId:current.item.id,sentOn:$('#aSent').value,reason:$('#aReason').value,vendor:$('#aVendor').value,cost:$('#aCost').value,currency:$('#aCurrency').value,returnedOn:$('#aReturned').value,result:$('#aResult').value}))}
function retireDialog(){actionDialog('退役設備',`${field('aDate','退役日期','date','required')}<div class="field"><label>原因</label><select class="control" id="aRetire"><option value="scrapped">報廢</option><option value="sold">出售</option><option value="donated">捐贈</option><option value="irreparable">損壞無法修復</option><option value="other">其他</option></select></div><div class="field wide"><label>說明</label><textarea class="control" id="aRNote" required></textarea></div>`,async()=>api('retire',{id:current.item.id,date:$('#aDate').value,reason:$('#aRetire').value,note:$('#aRNote').value}))}
function lostDialog(){actionDialog('標記遺失／遭竊',`${field('aDate','發生日期','date','required')}${field('aLostReason','原因','text','required')}<div class="field wide"><label>說明</label><textarea class="control" id="aLostNote" required></textarea></div>`,async()=>api('markLost',{id:current.item.id,date:$('#aDate').value,reason:$('#aLostReason').value,note:$('#aLostNote').value}))}
function inventoryDialog(){actionDialog('年度盤點確認',`<div class="field"><label>盤點結果</label><select class="control" id="aInv"><option value="held">仍在保管</option><option value="abnormal">設備異常</option><option value="missing">已找不到</option></select></div><div class="field wide"><label>備註</label><textarea class="control" id="aInvNote"></textarea></div>`,async()=>api('inventoryConfirm',{assetId:current.item.id,year:new Date().getFullYear(),result:$('#aInv').value,note:$('#aInvNote').value}))}
function uploadDialog(kind){const receipt=kind==='receipt';actionDialog(receipt?'上傳發票／收據':'上傳實物照片',`<div class="field wide"><label>${receipt?'PDF、JPG 或 PNG':'JPG、PNG 或 WebP'}，最大 8 MB</label><input class="control" id="aFile" type="file" accept="${receipt?'application/pdf,image/jpeg,image/png':'image/jpeg,image/png,image/webp'}" required></div>`,async()=>{const f=$('#aFile').files[0];if(!f)throw Error('請選擇檔案');const base64=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});return api('uploadFile',{assetId:current.item.id,kind,name:f.name,mime:f.type,base64})})}
async function restoreCurrent(){if(!confirm('確定恢復為可借用？'))return;await api('restore',{id:current.item.id});toast('已恢復');await refreshDetail()}async function refreshDetail(){current=await api('detail',{id:current.item.id});renderDetail();load(true)}
async function loadPending(){const j=await api('pending');const rows=j.transfers.map(t=>`<div class="pending-item"><div class="main"><h3>${esc(t.asset?.asset_code||'設備')} · ${esc(purposeName[t.purpose]||t.purpose)}</h3><p>${esc(t.from_emp_id||'—')} → ${esc(t.to_emp_id)}${t.conflict_detected?' · 時段衝突':''}</p></div>${t.to_emp_id===B.profile.empId||t.from_emp_id===B.profile.empId?`<button class="btn good small" onclick="respondDialog('${t.id}')">確認</button><button class="btn danger small" onclick="rejectDialog('${t.id}')">拒絕</button>`:''}${B.profile.role==='admin'?`<button class="btn small" onclick="forceDialog('${t.id}')">例外核准</button>`:''}${t.requested_by===B.profile.empId?`<button class="btn small" onclick="cancelTransfer('${t.id}')">取消</button>`:''}</div>`);$('#pendingList').innerHTML=rows.join('')||'<div class="empty">目前沒有待處理項目</div>'}
function respondDialog(id){actionDialog('確認設備移轉',`<div class="field"><label>設備狀況</label><select class="control" id="aCond"><option value="normal">正常</option><option value="used">有使用痕跡</option><option value="damaged">有損壞</option><option value="missing_accessory">配件缺少</option></select></div><div class="field wide"><label>狀況說明</label><textarea class="control" id="aCNote"></textarea></div>`,async()=>api('respondTransfer',{id,accept:true,condition:$('#aCond').value,conditionNote:$('#aCNote').value}))}async function cancelTransfer(id){await api('cancelTransfer',{id});toast('申請已取消');loadPending()}
function rejectDialog(id){actionDialog('拒絕移轉申請',`<div class="field wide"><label>拒絕原因</label><textarea class="control" id="aReject" required></textarea></div>`,async()=>api('respondTransfer',{id,accept:false,rejectionReason:$('#aReject').value}))}
function forceDialog(id){actionDialog('Admin 例外核准',`<div class="field wide"><label>保管人離職、停權或無法聯繫的原因</label><textarea class="control" id="aForce" required></textarea></div><p class="wide warn">需要兩位不同 Platform Admin 分別核准。</p>`,async()=>api('forceTransferApproval',{id,reason:$('#aForce').value}))}
async function requestReturn(id){try{await api('requestReturn',{transferId:id});toast('已提出歸還，等待原保管人確認');await refreshDetail()}catch(e){toast(e.message,true)}}
function renderTypes(){$('#typeRows').innerHTML=B.types.map(t=>`<div class="type-row"><b class="type-code">${esc(t.code)}xxx</b><span>${esc(t.name_zh)}</span><span>${esc(t.name_en)}</span></div>`).join('')}
async function loadAudit(){const j=await api('adminAudit');$('#auditRows').innerHTML=j.items.slice(0,40).map(a=>`<div class="history-row"><b>${esc(a.action)}</b><br><small>${esc(a.actor_emp_id)} · ${new Date(a.created_at).toLocaleString('zh-TW')}</small></div>`).join('')||'<span class="sub">尚無紀錄</span>'}
$('#assetForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;$('#formLive').textContent='建立資料並查找官方圖片中…';try{const j=await api('create',{typeCode:$('#fType').value,brand:$('#fBrand').value,model:$('#fModel').value,officialModelCode:$('#fOfficial').value,color:$('#fColor').value,manufacturerSerial:$('#fSerial').value,imei1:$('#fImei').value,ownershipUnit:$('#fOwner').value,custodianEmpId:$('#fCustodian').value,purchaseAmount:$('#fAmount').value,purchaseCurrency:$('#fCurrency').value,purchaseCountry:$('#fCountry').value,purchaseVendor:$('#fVendor').value,sourceNote:$('#fNote').value});close('formOverlay');e.target.reset();$('#fCustodian').value=B.profile.empId;toast(`已建立 ${j.item.assetCode}，可立即申請借用`);await load(true)}catch(x){toast(x.message,true)}finally{btn.disabled=false;$('#formLive').textContent=''}};
$('#personalForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const id=$('#personalId').value;try{await api(id?'personalUpdate':'personalCreate',{id,typeCode:$('#personalFormType').value,brand:$('#personalBrand').value,model:$('#personalModel').value,color:$('#personalColor').value});close('personalFormOverlay');e.target.reset();toast(id?'個人資產已更新':'已登錄，官方圖片將在背景補上');await personalLoad(true);if(!id)setTimeout(()=>scope==='personal'&&personalLoad(true),15000)}catch(x){toast(x.message,true)}finally{b.disabled=false}};
$('#personalImageInput').onchange=async e=>{const f=e.target.files[0];if(!f||!personalImageId)return;if(f.size>8*1024*1024){toast('圖片不可超過 8 MB',true);return}try{const base64=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});toast('正在上傳照片…');await api('personalUploadImage',{id:personalImageId,name:f.name,mime:f.type,base64});toast('照片已更新');await personalLoad(true)}catch(x){toast(x.message,true)}finally{personalImageId=null;e.target.value=''}};
$('#actionForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await actionHandler();close('actionOverlay');toast('已完成');if(current)await refreshDetail();await loadPending()}catch(x){toast(x.message,true)}finally{b.disabled=false}};
$('#newBtn').onclick=()=>open('formOverlay');$('#personalNewBtn').onclick=()=>openPersonalForm();$('#companyScope').onclick=()=>switchScope('company');$('#personalScope').onclick=()=>switchScope('personal');$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$$('.tab').forEach(t=>t.onclick=async()=>{$$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');['list','pending','manage'].forEach(v=>$('#view-'+v).classList.toggle('hidden',v!==t.dataset.tab));if(t.dataset.tab==='pending')await loadPending();if(t.dataset.tab==='manage')await loadAudit()});let timer;$('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>load(true),350)};let personalTimer;$('#personalQ').oninput=()=>{clearTimeout(personalTimer);personalTimer=setTimeout(()=>personalLoad(true),350)};['typeFilter','statusFilter','ownerFilter','includeRetired'].forEach(id=>$('#'+id).onchange=()=>load(true));['personalType','personalMine','personalInactive'].forEach(id=>$('#'+id).onchange=()=>personalLoad(true));$('#loadMore').onclick=()=>load(false);$('#personalMore').onclick=()=>personalLoad(false);
$('#addTypeBtn').onclick=()=>actionDialog('新增設備類型',`${field('aCode','代碼首字母','text','maxlength="1" required')}${field('aZh','中文名稱','text','required')}${field('aEn','英文名稱','text','required')}`,async()=>{await api('addType',{code:$('#aCode').value,nameZh:$('#aZh').value,nameEn:$('#aEn').value});B=await api('bootstrap');fillOptions();renderTypes()});
init().catch(e=>{toast('初始化失敗：'+e.message,true);$('#cards').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
</script>
</body></html>
