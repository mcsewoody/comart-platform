<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>COMART 手機與配件 v1.10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#080c14">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* 🔴 這一段與 Portal index.html 的 :root 相同 —— 平台共用的設計 token。
       要改配色先改 Portal 再同步，不要只在這裡調（v1.09 之前這裡是自己一套
       cyan #2D7FF9，hub 又是 teal #47d7c9，三個畫面三種顏色）。*/
    :root{
      --bg:#0A0E17;--s1:#111827;--s2:#1A2335;--s3:#222E42;
      --br:#2D3F5A;--br2:#3D5275;
      --tx:#F5F9FF;--tx2:#CDE0FF;--tx3:#A8C4EC;
      --ac:#2D7FF9;--ac2:rgba(45,127,249,.12);--ac3:rgba(45,127,249,.06);
      --red:#F25C5C;--grn:#3DD68C;--amb:#F0A429;
      --ff:'DM Sans',-apple-system,'PingFang TC','Noto Sans TC',sans-serif;
      --fd:'DM Serif Display',Georgia,serif;
      --fm:'DM Mono',monospace;
      --r:10px;--rl:14px;
      /* 本檔既有名稱 → 平台 token（不要再各自給值）*/
      --panel:var(--s1);--line:var(--br);--text:var(--tx);--muted:var(--tx3);
      --accent:var(--ac);--yellow:var(--amb);
      --shadow:0 18px 55px rgba(0,0,0,.45)
    }
/* 🔴 DM Sans 沒有越南文字集 —— Google Fonts 對它只給 latin 與 latin-ext 兩個
       unicode-range，連明確指定 subset=vietnamese 也一樣。越南文的 U+1EA0–U+1EF9
       （ị ế ộ ự…）因此會**逐字**掉到系統字型，同一個詞裡混兩種字，看起來像變音
       符號散掉了。介面切成越南文時整份換成 Be Vietnam Pro（幾何無襯線，與 DM Sans
       相容，且有完整越南文字集）。lang 由 dvSetLang／pdSetLang 設定。*/
    html[lang="vi"]{--ff:'Be Vietnam Pro','DM Sans',-apple-system,sans-serif}

    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
    .lchip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid var(--br);background:transparent;color:var(--tx3);cursor:pointer;transition:all .12s;white-space:nowrap}.lchip:hover{color:var(--tx);border-color:var(--br2)}.lchip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}#langChips{display:flex;gap:4px;overflow:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}.top{position:sticky;top:0;z-index:20;height:72px;background:rgba(17,24,39,.95);backdrop-filter:blur(18px);border-bottom:1px solid #1d2d45;display:flex;align-items:center;gap:14px;padding:0 max(20px,calc((100vw - 1500px)/2));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}.back,.icon-btn,.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#101a2b;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;text-decoration:none;font-weight:750}.back:hover,.icon-btn:hover,.btn:hover{border-color:#4d6d99;background:#17243a}.brand{display:flex;align-items:center;gap:11px;min-width:0}.mark{width:42px;height:42px;border-radius:13px;background:var(--ac2);color:var(--ac);display:grid;place-items:center}.brand b{display:block;font-size:17px;white-space:nowrap}.brand small{display:block;color:var(--muted);font-weight:700;letter-spacing:.12em;margin-top:3px}.grow{flex:1}.user{text-align:right}.user b{display:block;font-size:13px}.user small{color:var(--muted)}
    .shell{max-width:1500px;margin:auto;padding:28px 24px 70px}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:25px}.eyebrow{color:var(--accent);font-size:12px;font-weight:900;letter-spacing:.2em}.hero h1{font-size:clamp(30px,4vw,48px);letter-spacing:-.045em;margin:7px 0}.hero p{color:var(--muted);margin:0;line-height:1.65}.btn.primary{border-color:var(--ac);background:var(--ac);color:#fff}.btn.danger{border-color:#743543;color:#ffb0b7;background:#29121a}.btn.good{border-color:#227050;color:#7ef0ba;background:#102820}.btn.small{min-height:36px;padding:0 12px;font-size:12px}.btn[disabled]{opacity:.45;cursor:not-allowed}
    .scope-switch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 24px;padding:7px;background:#0a1322;border:1px solid var(--line);border-radius:18px}.scope-btn{min-height:68px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted);font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}.scope-btn.active{color:#fff;background:var(--ac);box-shadow:0 8px 24px rgba(45,127,249,.22)}.scope-btn:not(.active):hover{background:#142238;color:var(--text);border-color:#304866}
    .tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow:auto}.tab{position:relative;background:none;border:0;color:var(--muted);padding:15px 18px;font-weight:850;white-space:nowrap}.tab.active{color:var(--text)}.tab.active:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent)}.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:20px;background:#233550;color:#cfdbec;font-size:11px}.badge.hot{background:#5b201f;color:#ffb8b6}
    .filters{display:grid;grid-template-columns:minmax(240px,1fr) repeat(3,minmax(145px,190px));gap:10px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:#a9bad0;font-weight:800}.control{width:100%;min-height:46px;padding:10px 13px;color:var(--text);background:#0d1727;border:1px solid var(--line);border-radius:12px}.search{position:relative}.search i{position:absolute;left:14px;top:15px;color:var(--muted)}.search input{padding-left:44px}
    .summary{display:flex;justify-content:space-between;align-items:center;margin:10px 0 15px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:linear-gradient(160deg,#111e32,#0d1626);border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;min-width:0;transition:.18s transform,.18s border-color;box-shadow:0 8px 26px #0002}.card:hover{transform:translateY(-2px);border-color:#3e6387}.card-image{aspect-ratio:16/10;background:#07101d;display:grid;place-items:center;overflow:hidden;position:relative}.card-image img{width:100%;height:100%;object-fit:contain;background:#fff}.placeholder{font-size:44px;color:#44617e}.status{position:absolute;left:12px;top:12px;padding:5px 9px;border-radius:999px;background:#0b1524dd;border:1px solid #ffffff20;font-size:11px;font-weight:850}.s-available{color:#65ecb3}.s-in_use{color:#72c3ff}.s-maintenance{color:#ffd77d}.s-lost,.s-retired{color:#ff929d}.card-body{padding:16px}.code{font-family:var(--fm);color:var(--accent);font-weight:900;letter-spacing:.12em;font-size:12px}.card h3{margin:8px 0 5px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:13px;color:var(--muted);min-height:38px}.meta{border-top:1px solid #22334d;margin-top:13px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#b6c4d6}.custodian{font-size:15px;font-weight:900;color:#f4f7fb}.card-actions{display:grid;grid-template-columns:1.08fr .92fr;gap:8px;margin-top:13px}.card-actions .btn{width:100%;position:relative;z-index:2;padding:0 8px}.btn.borrow-cta,.btn.transfer-cta{min-height:48px;font-size:14px;font-weight:950}.btn.borrow-cta{border:1px solid var(--ac);background:var(--ac);color:#fff;box-shadow:0 8px 22px rgba(45,127,249,.28)}.btn.borrow-cta:hover{border-color:#5B9BFF;background:#4A8FFF;transform:translateY(-1px)}.btn.transfer-cta{border:1px solid var(--br2);background:var(--s2);color:var(--tx);box-shadow:none}.btn.transfer-cta:hover{border-color:var(--ac);background:var(--s3);transform:translateY(-1px)}.btn.borrow-cta[disabled],.btn.transfer-cta[disabled]{background:#16243a;color:#71839b;border-color:#2d405d;box-shadow:none;transform:none}.custodian-fact{border-color:#2D4F7A;background:linear-gradient(135deg,#10283a,#111d30);font-size:18px;font-weight:900}.custodian-fact small{font-size:12px;font-weight:700}.empty{grid-column:1/-1;padding:70px 20px;text-align:center;background:#0d1725;border:1px dashed #334968;border-radius:var(--rl);color:var(--muted)}.loadmore{display:block;margin:24px auto 0}.hidden{display:none!important}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:20px}.pending-list{display:grid;gap:12px}.pending-item{display:flex;align-items:center;gap:15px;border:1px solid #263956;border-radius:14px;padding:15px;background:#0b1525}.pending-item .main{flex:1;min-width:0}.pending-item h3{margin:0 0 5px}.pending-item p{margin:0;color:var(--muted);font-size:13px}.warn{color:var(--yellow);font-size:12px;font-weight:800}.manage-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.type-row{display:grid;grid-template-columns:50px 1fr 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #21314a}.type-code{font-family:var(--fm);font-size:18px;color:var(--accent)}
    .personal-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.personal-head h2{font-size:25px;margin:0 0 6px}.personal-head p{margin:0;color:var(--muted);line-height:1.6}.personal-filters{display:grid;grid-template-columns:minmax(260px,1fr) 190px auto auto;align-items:center;gap:10px;margin-bottom:16px}.checkline{display:flex;align-items:center;gap:8px;color:#b9c7d8;font-size:13px;white-space:nowrap}.owner-line{display:flex;align-items:center;gap:9px;border-top:1px solid #22334d;margin-top:13px;padding-top:12px}.owner-avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#203552;color:#7FB2FF;font-size:12px;font-weight:900}.owner-line b{display:block;font-size:12px}.owner-line small{color:var(--muted);font-size:11px}.personal-card .sub{min-height:auto}.personal-actions{display:flex;gap:7px;margin-top:13px}.personal-actions .btn{flex:1;padding:0 9px}
    .overlay{position:fixed;inset:0;background:#02060dcc;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:5vh 18px;overflow:auto}.overlay.open{display:flex}.modal{width:min(920px,100%);background:#0d1727;border:1px solid #345074;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.modal-head{position:sticky;top:0;z-index:3;background:#0d1727f2;backdrop-filter:blur(15px);display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;flex:1;font-size:22px}.close{width:44px;padding:0}.modal-body{padding:22px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form-grid .wide{grid-column:1/-1}.required:after{content:" *";color:var(--red)}textarea.control{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}.detail-hero{display:grid;grid-template-columns:280px 1fr;gap:22px}.detail-image{aspect-ratio:1;background:#07101d;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;overflow:hidden}.detail-image img{width:100%;height:100%;object-fit:contain;background:#fff}.detail-title h2{font-size:30px;margin:8px 0}.pills{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:5px 9px;border-radius:999px;background:#1a2a43;color:#c9d5e5;font-size:12px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.fact{background:#111d30;border:1px solid #243752;border-radius:12px;padding:12px}.fact small{display:block;color:var(--muted);margin-bottom:5px}.sections{display:grid;gap:14px}.section{border:1px solid #263a57;border-radius:15px;overflow:hidden}.section summary{cursor:pointer;padding:15px 17px;font-weight:850;background:#101c2e}.section .inside{padding:16px}.history{display:grid;gap:9px}.history-row{border-left:3px solid #2b5875;padding:8px 12px;background:#0a1422}.history-row small{color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;z-index:90;max-width:390px;background:#16243a;border:1px solid #40628b;border-radius:13px;padding:13px 16px;box-shadow:var(--shadow);display:none}.toast.show{display:block}.toast.err{border-color:#8d3949;color:#ffc0c6}.live{min-height:20px;color:var(--muted);font-size:13px;margin:8px 0}
    @media(max-width:1120px){.grid{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr}.manage-grid{grid-template-columns:1fr}}
    @media(max-width:760px){.top{height:auto;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}.brand small,.user{display:none}.shell{padding:20px 14px 70px}.hero{align-items:flex-start}.hero p{font-size:14px}.btn.primary{padding:0 13px}.scope-btn{min-height:56px;font-size:15px}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.personal-head{align-items:flex-start;flex-direction:column}.personal-filters{grid-template-columns:1fr 1fr}.personal-filters .search{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.card-body{padding:12px}.card h3{font-size:15px}.meta{display:block}.meta span{display:block;margin-top:5px}.form-grid,.detail-hero{grid-template-columns:1fr}.detail-image{max-width:360px;width:100%;margin:auto}.facts{grid-template-columns:1fr 1fr}.modal-body{padding:16px}.overlay{padding:0}.modal{min-height:100%;border-radius:0}.pending-item{align-items:flex-start;flex-wrap:wrap}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.filters .search{grid-column:auto}.hero h1{font-size:29px}.hero{gap:10px}.back span{display:none}.facts{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <a class="sr-only" href="#main" data-i18n="skip">跳至主要內容</a>
  <header class="top">
    <a class="back" id="backLink" href="../index.html"><i data-lucide="arrow-left" width="18"></i><span>Product Dev</span></a>
    <div class="brand"><div class="mark"><i data-lucide="smartphone" width="22"></i></div><div><b data-i18n="app_title">手機與配件</b><small>DEVICE CUSTODY · v1.10</small></div></div>
    <div class="grow"></div><div id="langChips"></div><div class="user"><b id="userName" data-i18n="verifying">驗證中…</b><small id="userMeta"></small></div>
  </header>
  <main class="shell" id="main">
    <section class="hero"><div><span class="eyebrow">PRODUCT DEVELOPMENT</span><h1 data-i18n="app_title">手機與配件</h1><p data-i18n="hero_p">公司資產依流程管理。</p></div><button class="btn primary" id="newBtn"><i data-lucide="plus"></i><span data-i18n="btn_new_company">新增公司設備</span></button></section>
    <nav class="scope-switch" data-i18n-label="scope_group" aria-label="資產大類"><button class="scope-btn active" id="companyScope"><i data-lucide="building-2"></i><span data-i18n="scope_company">公司資產</span></button><button class="scope-btn" id="personalScope"><i data-lucide="user-round"></i><span data-i18n="scope_personal">個人資產</span></button></nav>
    <div id="companyArea">
    <nav class="tabs" role="tablist" data-i18n-label="tabs_aria" aria-label="手機與配件功能">
      <button class="tab active" role="tab" data-tab="list" data-i18n="tab_list">設備清單</button>
      <button class="tab" role="tab" data-tab="pending"><span data-i18n="tab_pending">待我確認</span><span class="badge" id="pendingBadge">0</span></button>
      <button class="tab hidden" role="tab" data-tab="manage" id="manageTab" data-i18n="tab_manage">管理</button>
    </nav>
    <section id="view-list">
      <div class="filters">
        <div class="search"><i data-lucide="search" width="18"></i><label class="sr-only" for="q" data-i18n="search_device">搜尋設備</label><input class="control" id="q" data-i18n-ph="ph_search" placeholder="資產編號、品牌、型號、序號、保管人…"></div>
        <select class="control" id="typeFilter" data-i18n-label="f_type" aria-label="設備類型"><option value="" data-i18n="opt_all_types">所有類型</option></select>
        <select class="control" id="statusFilter" data-i18n-label="f_status" aria-label="設備狀態"><option value="" data-i18n="opt_all_status">所有狀態</option><option value="available" data-i18n="st_available">可借用</option><option value="in_use" data-i18n="st_in_use">使用中</option><option value="maintenance" data-i18n="st_maintenance">維修中</option><option value="lost" data-i18n="st_lost">遺失／遭竊</option></select>
        <select class="control" id="ownerFilter" data-i18n-label="f_owner" aria-label="資產歸屬"><option value="" data-i18n="opt_all_owner">所有歸屬單位</option></select>
      </div>
      <label style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:8px"><input type="checkbox" id="includeRetired"> <span data-i18n="show_retired">顯示已退役設備</span></label>
      <div class="summary"><span id="totalText" data-i18n="loading">讀取中…</span><span id="resultHint"></span></div>
      <div class="grid" id="cards" aria-live="polite"></div><button class="btn loadmore hidden" id="loadMore" data-i18n="load_more">載入下 30 筆</button>
    </section>
    <section id="view-pending" class="hidden"><div class="panel"><h2 data-i18n="pending_title">待處理</h2><p style="color:var(--muted)" data-i18n="pending_note">設備資料與保管權移轉分開確認。</p><div class="pending-list" id="pendingList"></div></div></section>
    <section id="view-manage" class="hidden"><div class="manage-grid"><div class="panel"><h2 data-i18n="f_type">設備類型</h2><div id="typeRows"></div><div class="actions" style="justify-content:flex-start"><button class="btn small" id="addTypeBtn" data-i18n="mg_add_type">新增類型</button></div></div><div class="panel"><h2 data-i18n="mg_audit">最近稽核紀錄</h2><div class="history" id="auditRows"></div></div></div></section>
    </div>
    <section id="personalArea" class="hidden">
      <div class="personal-head"><div><h2 data-i18n="p_title">個人資產調查</h2><p data-i18n="p_note">登錄即代表同事可聯絡詢問借用。</p></div><button class="btn primary" id="personalNewBtn"><i data-lucide="plus"></i><span data-i18n="p_new">登錄我的資產</span></button></div>
      <div class="personal-filters">
        <div class="search"><i data-lucide="search" width="18"></i><label class="sr-only" for="personalQ" data-i18n="p_search">搜尋個人資產</label><input class="control" id="personalQ" data-i18n-ph="p_ph_search" placeholder="品牌、型號、顏色、擁有人…"></div>
        <select class="control" id="personalType" data-i18n-label="p_type_aria" aria-label="個人資產類型"><option value="" data-i18n="opt_all_types">所有類型</option></select>
        <label class="checkline"><input type="checkbox" id="personalMine"> <span data-i18n="p_mine">只看我的</span></label>
        <label class="checkline hidden" id="personalInactiveWrap"><input type="checkbox" id="personalInactive"> <span data-i18n="p_inactive">顯示離職／停權資料</span></label>
      </div>
      <div class="summary"><span id="personalTotal" data-i18n="p_count0">共 0 筆</span><span data-i18n="p_voluntary">只顯示自願登錄資料</span></div>
      <div class="grid" id="personalCards" aria-live="polite"></div><button class="btn loadmore hidden" id="personalMore" data-i18n="load_more">載入下 30 筆</button>
    </section>
  </main>

  <div class="overlay" id="formOverlay" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="modal"><div class="modal-head"><h2 id="formTitle" data-i18n="form_new">新增設備</h2><button class="icon-btn close" data-close="formOverlay" data-i18n-label="btn_close" aria-label="關閉"><i data-lucide="x"></i></button></div><form class="modal-body" id="assetForm"><div class="form-grid">
    <div class="field"><label class="required" for="fType" data-i18n="f_type">設備類型</label><select class="control" id="fType" required></select></div>

let DVLANG='zh-TW';
function DT(k,p){
  let v=(DV_I18N[DVLANG]||DV_I18N['zh-TW'])[k];
  if(v===undefined)v=DV_I18N['zh-TW'][k];
  if(v===undefined)return k;
  if(p)Object.keys(p).forEach(x=>{v=v.split('{'+x+'}').join(p[x])});
  return v;
}
function dvInitLang(){
  let l='';try{l=localStorage.getItem('comart-lang')||''}catch{}
  if(!DV_I18N[l])l=({TW:'zh-TW',CN:'zh-CN',VN:'vi'})[S&&S.site]||'zh-TW';
  DVLANG=l;document.documentElement.lang=l;
}
function dvSetLang(l){
  if(!DV_I18N[l]||l===DVLANG)return;
  DVLANG=l;try{localStorage.setItem('comart-lang',l)}catch{}
  document.documentElement.lang=l;dvApplyI18n();dvRerender();
}
function dvApplyI18n(){
  $$('[data-i18n]').forEach(e=>{e.textContent=DT(e.getAttribute('data-i18n'))});
  $$('[data-i18n-ph]').forEach(e=>{e.placeholder=DT(e.getAttribute('data-i18n-ph'))});
  $$('[data-i18n-label]').forEach(e=>{e.setAttribute('aria-label',DT(e.getAttribute('data-i18n-label')))});
  document.title='COMART '+DT('app_title')+' v1.10';
  const box=$('#langChips');
  if(box){
    box.innerHTML=DV_LANGS.map(l=>`<button class="lchip${l[0]===DVLANG?' on':''}" onclick="dvSetLang('${l[0]}')">${l[1]}</button>`).join('');
    const on=box.querySelector('.lchip.on');if(on){try{on.scrollIntoView({block:'nearest',inline:'nearest'})}catch{}}
  }
  if(B&&B.profile)$('#userMeta').textContent=DT(B.profile.role==='admin'?'role_admin':'role_user')+' · '+B.profile.empId;
}
function dvRerender(){
  try{fillOptions()}catch{}
  try{renderTypes()}catch{}
  try{renderCards()}catch{}
  try{if(scope==='personal')renderPersonalCards()}catch{}
  try{if(current)renderDetail()}catch{}
  try{if($('.tab.active')?.dataset.tab==='pending')loadPending()}catch{}
  try{lucide.createIcons()}catch{}
}
function decode(v){try{return JSON.parse(decodeURIComponent(escape(atob(v))))}catch{return null}}
function toast(msg,err=false){const e=$('#toast');e.textContent=msg;e.className='toast show'+(err?' err':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',4500)}
async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-session':S.sig},body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({error:'invalid_response'}));if(!r.ok)throw Error(j.error||`HTTP ${r.status}`);return j}
function open(id){$('#'+id).classList.add('open');setTimeout(()=>$('#'+id).querySelector('button,input,select')?.focus(),20)}function close(id){$('#'+id).classList.remove('open')}
function fmtDate(v){return v?new Date(v).toLocaleDateString('zh-TW'):'—'}function fmtMoney(a,c){return a==null?'—':`${c||''} ${Number(a).toLocaleString()}`}
/* 🔴 列舉值不能在載入時就算好：那樣切語言之後卡片上的狀態會留在舊語言。
   用 Proxy 讓 `statusName[x]` 這種既有寫法原封不動，但每次取值都走當下的 DT()。
   查無此鍵時回 undefined（不是回 key 名稱）—— 呼叫端有 `||DT('not_requestable')` 這種
   後備，回字串會讓那個後備永遠不生效。 */
const enumName=pre=>new Proxy({},{get:(_,k)=>{const key=pre+String(k);return DV_I18N['zh-TW'][key]!==undefined?DT(key):undefined}});
const statusName=enumName('st_'),purposeName=enumName('pu_'),conditionName=enumName('cd_');
function session(){const q=new URLSearchParams(location.search);S=q.get('_ps')?decode(q.get('_ps')):null;if(S?.sig)localStorage.setItem(KEY,JSON.stringify(S));if(!S)try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(q.has('_ps')){q.delete('_ps');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''))}if(!S?.sig||!S.empId||S.expires&&Date.now()>S.expires){location.href='../index.html';return false}return true}
async function init(){if(!session())return;
  /* 🔴 語言要在 bootstrap 之前就套用：等 API 回來才套的話，後端不通時
     整頁會停在中文、連語言鈕都不會出現 —— 而那正是最需要看懂錯誤訊息的時候。*/
  dvInitLang();dvApplyI18n();
  B=await api('bootstrap');$('#userName').textContent=B.profile.name;$('#userMeta').textContent=(B.profile.role==='admin'?DT('role_admin'):DT('role_user'))+' · '+B.profile.empId;$('#pendingBadge').textContent=B.badges.pendingForMe;if(B.profile.role==='admin'){$('#manageTab').classList.remove('hidden');$('#personalInactiveWrap').classList.remove('hidden')}fillOptions();renderTypes();const assetCode=new URLSearchParams(location.search).get('asset');if(assetCode)$('#q').value=assetCode;await load(true);if(assetCode){const exact=items.find(x=>x.assetCode.toUpperCase()===assetCode.toUpperCase());if(exact)await showDetail(exact.id)}lucide.createIcons()}
function fillOptions(){const ts=B.types.map(t=>`<option value="${esc(t.code)}">${esc(t.name_zh)} · ${esc(t.code)}xxx</option>`).join('');$('#fType').innerHTML=ts;$('#typeFilter').innerHTML=`<option value="">${DT('opt_all_types')}</option>`+ts;$('#personalType').innerHTML=`<option value="">${DT('opt_all_types')}</option>`+B.types.map(t=>`<option value="${esc(t.code)}">${esc(t.name_zh)}</option>`).join('');$('#personalFormType').innerHTML=B.types.map(t=>`<option value="${esc(t.code)}">${esc(t.name_zh)}</option>`).join('');const users=B.users.map(u=>`<option value="${esc(u.emp_id)}">${esc(u.name_zh||u.name_en||u.emp_id)} · ${esc(u.emp_id)}</option>`).join('');$('#fCustodian').innerHTML=users;$('#fCustodian').value=B.profile.empId;const units=[...new Map([...B.departments,...B.sites].map(x=>[(x.zh||x.en||x.key),x])).values()].map(x=>x.zh||x.en||x.key);$('#fOwner').innerHTML=units.map(x=>`<option>${esc(x)}</option>`).join('');$('#ownerFilter').innerHTML=`<option value="">${DT('opt_all_owner')}</option>`+units.map(x=>`<option>${esc(x)}</option>`).join('')}
async function load(reset=false){const seq=++loadSeq;if(reset){offset=0;items=[];$('#cards').innerHTML=`<div class="empty">${DT('loading')}</div>`}try{const j=await api('list',{query:$('#q').value,typeCode:$('#typeFilter').value,status:$('#statusFilter').value,owner:$('#ownerFilter').value,includeRetired:$('#includeRetired').checked,limit:30,offset});if(seq!==loadSeq)return;total=j.total;items.push(...j.items);offset=items.length;renderCards();$('#loadMore').classList.toggle('hidden',offset>=total)}catch(e){if(seq===loadSeq)$('#cards').innerHTML=`<div class="empty">${DT('load_failed',{m:esc(e.message)})}</div>`}}

function uploadDialog(kind){const receipt=kind==='receipt';actionDialog(receipt?DT('btn_upload_receipt'):DT('dlg_upload_photo'),`<div class="field wide"><label>${DT('file_hint',{t:receipt?DT('file_types_receipt'):DT('file_types_photo')})}</label><input class="control" id="aFile" type="file" accept="${receipt?'application/pdf,image/jpeg,image/png':'image/jpeg,image/png,image/webp'}" required></div>`,async()=>{const f=$('#aFile').files[0];if(!f)throw Error(DT('pick_file'));const base64=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});return api('uploadFile',{assetId:current.item.id,kind,name:f.name,mime:f.type,base64})})}
async function restoreCurrent(){if(!confirm(DT('confirm_restore')))return;await api('restore',{id:current.item.id});toast(DT('restored'));await refreshDetail()}async function refreshDetail(){current=await api('detail',{id:current.item.id});renderDetail();load(true)}
async function loadPending(){const j=await api('pending');const rows=j.transfers.map(t=>`<div class="pending-item"><div class="main"><h3>${esc(t.asset?.asset_code||DT('device_word'))} · ${esc(purposeName[t.purpose]||t.purpose)}</h3><p>${esc(t.from_emp_id||'—')} → ${esc(t.to_emp_id)}${t.conflict_detected?' · '+DT('time_conflict'):''}</p></div>${t.to_emp_id===B.profile.empId||t.from_emp_id===B.profile.empId?`<button class="btn good small" onclick="respondDialog('${t.id}')">${DT('btn_confirm')}</button><button class="btn danger small" onclick="rejectDialog('${t.id}')">${DT('btn_reject')}</button>`:''}${B.profile.role==='admin'?`<button class="btn small" onclick="forceDialog('${t.id}')">${DT('btn_force')}</button>`:''}${t.requested_by===B.profile.empId?`<button class="btn small" onclick="cancelTransfer('${t.id}')">${DT('btn_cancel')}</button>`:''}</div>`);$('#pendingList').innerHTML=rows.join('')||`<div class="empty">${DT('pending_empty')}</div>`}
function respondDialog(id){actionDialog(DT('dlg_confirm_transfer'),`<div class="field"><label>${DT('l_condition')}</label><select class="control" id="aCond"><option value="normal">${DT('cd_normal')}</option><option value="used">${DT('cd_used')}</option><option value="damaged">${DT('cd_damaged')}</option><option value="missing_accessory">${DT('cd_missing_accessory')}</option></select></div><div class="field wide"><label>${DT('l_condition_desc')}</label><textarea class="control" id="aCNote"></textarea></div>`,async()=>api('respondTransfer',{id,accept:true,condition:$('#aCond').value,conditionNote:$('#aCNote').value}))}async function cancelTransfer(id){await api('cancelTransfer',{id});toast(DT('cancelled'));loadPending()}
function rejectDialog(id){actionDialog(DT('dlg_reject'),`<div class="field wide"><label>${DT('l_reject_reason')}</label><textarea class="control" id="aReject" required></textarea></div>`,async()=>api('respondTransfer',{id,accept:false,rejectionReason:$('#aReject').value}))}
function forceDialog(id){actionDialog(DT('dlg_force'),`<div class="field wide"><label>${DT('l_force_reason')}</label><textarea class="control" id="aForce" required></textarea></div><p class="wide warn">${DT('force_note')}</p>`,async()=>api('forceTransferApproval',{id,reason:$('#aForce').value}))}
async function requestReturn(id){try{await api('requestReturn',{transferId:id});toast(DT('return_requested'));await refreshDetail()}catch(e){toast(e.message,true)}}
function renderTypes(){$('#typeRows').innerHTML=B.types.map(t=>`<div class="type-row"><b class="type-code">${esc(t.code)}xxx</b><span>${esc(t.name_zh)}</span><span>${esc(t.name_en)}</span></div>`).join('')}
async function loadAudit(){const j=await api('adminAudit');$('#auditRows').innerHTML=j.items.slice(0,40).map(a=>`<div class="history-row"><b>${esc(a.action)}</b><br><small>${esc(a.actor_emp_id)} · ${new Date(a.created_at).toLocaleString('zh-TW')}</small></div>`).join('')||`<span class="sub">${DT('mg_no_record')}</span>`}
$('#assetForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;$('#formLive').textContent=DT('creating');try{const j=await api('create',{typeCode:$('#fType').value,brand:$('#fBrand').value,model:$('#fModel').value,officialModelCode:$('#fOfficial').value,color:$('#fColor').value,manufacturerSerial:$('#fSerial').value,imei1:$('#fImei').value,ownershipUnit:$('#fOwner').value,custodianEmpId:$('#fCustodian').value,purchaseAmount:$('#fAmount').value,purchaseCurrency:$('#fCurrency').value,purchaseCountry:$('#fCountry').value,purchaseVendor:$('#fVendor').value,sourceNote:$('#fNote').value});close('formOverlay');e.target.reset();$('#fCustodian').value=B.profile.empId;toast(DT('created_ok',{c:j.item.assetCode}));await load(true)}catch(x){toast(x.message,true)}finally{btn.disabled=false;$('#formLive').textContent=''}};
$('#personalForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;const id=$('#personalId').value;try{await api(id?'personalUpdate':'personalCreate',{id,typeCode:$('#personalFormType').value,brand:$('#personalBrand').value,model:$('#personalModel').value,color:$('#personalColor').value});close('personalFormOverlay');e.target.reset();toast(id?DT('p_updated'):DT('p_created'));await personalLoad(true);if(!id)setTimeout(()=>scope==='personal'&&personalLoad(true),15000)}catch(x){toast(x.message,true)}finally{b.disabled=false}};
$('#personalImageInput').onchange=async e=>{const f=e.target.files[0];if(!f||!personalImageId)return;if(f.size>8*1024*1024){toast(DT('p_img_too_big'),true);return}try{const base64=await new Promise((ok,no)=>{const r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});toast(DT('p_uploading'));await api('personalUploadImage',{id:personalImageId,name:f.name,mime:f.type,base64});toast(DT('p_img_updated'));await personalLoad(true)}catch(x){toast(x.message,true)}finally{personalImageId=null;e.target.value=''}};
$('#actionForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{await actionHandler();close('actionOverlay');toast(DT('done'));if(current)await refreshDetail();await loadPending()}catch(x){toast(x.message,true)}finally{b.disabled=false}};
$('#newBtn').onclick=()=>open('formOverlay');$('#personalNewBtn').onclick=()=>openPersonalForm();$('#companyScope').onclick=()=>switchScope('company');$('#personalScope').onclick=()=>switchScope('personal');$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$$('.tab').forEach(t=>t.onclick=async()=>{$$('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');['list','pending','manage'].forEach(v=>$('#view-'+v).classList.toggle('hidden',v!==t.dataset.tab));if(t.dataset.tab==='pending')await loadPending();if(t.dataset.tab==='manage')await loadAudit()});let timer;$('#q').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>load(true),350)};let personalTimer;$('#personalQ').oninput=()=>{clearTimeout(personalTimer);personalTimer=setTimeout(()=>personalLoad(true),350)};['typeFilter','statusFilter','ownerFilter','includeRetired'].forEach(id=>$('#'+id).onchange=()=>load(true));['personalType','personalMine','personalInactive'].forEach(id=>$('#'+id).onchange=()=>personalLoad(true));$('#loadMore').onclick=()=>load(false);$('#personalMore').onclick=()=>personalLoad(false);
$('#addTypeBtn').onclick=()=>actionDialog(DT('dlg_add_type'),`${field('aCode',DT('fld_code_initial'),'text','maxlength="1" required')}${field('aZh',DT('fld_name_zh'),'text','required')}${field('aEn',DT('fld_name_en'),'text','required')}`,async()=>{await api('addType',{code:$('#aCode').value,nameZh:$('#aZh').value,nameEn:$('#aEn').value});B=await api('bootstrap');fillOptions();renderTypes()});
init().catch(e=>{toast(DT('init_failed',{m:e.message}),true);$('#cards').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
</script>
</body></html>
