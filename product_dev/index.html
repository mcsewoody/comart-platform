<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>COMART Product Dev v2.25</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@400&family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* 🔴 這一段與 Portal index.html 的 :root 完全相同 —— 平台共用的設計 token。
       要改配色請先改 Portal，再同步過來，不要只在這裡調（v2.21 之前這裡是
       自己一套 teal #47d7c9，devices 又是另一套 cyan #16cee5，三個畫面三種顏色）。*/
    :root{
      --bg:#0A0E17;--s1:#111827;--s2:#1A2335;--s3:#222E42;
      --br:#2D3F5A;--br2:#3D5275;
      --tx:#F5F9FF;--tx2:#CDE0FF;--tx3:#A8C4EC;
      --ac:#2D7FF9;--ac2:rgba(45,127,249,.12);--ac3:rgba(45,127,249,.06);
      --red:#F25C5C;--red2:rgba(242,92,92,.12);
      --grn:#3DD68C;--amb:#F0A429;
      --ff:'DM Sans',-apple-system,'PingFang TC','Noto Sans TC',sans-serif;
      --fd:'DM Serif Display',Georgia,serif;
      --fm:'DM Mono',monospace;
      --r:10px;--rl:14px;
    }
/* 🔴 DM Sans 沒有越南文字集 —— Google Fonts 對它只給 latin 與 latin-ext 兩個
       unicode-range，連明確指定 subset=vietnamese 也一樣。越南文的 U+1EA0–U+1EF9
       （ị ế ộ ự…）因此會**逐字**掉到系統字型，同一個詞裡混兩種字，看起來像變音
       符號散掉了。介面切成越南文時整份換成 Be Vietnam Pro（幾何無襯線，與 DM Sans
       相容，且有完整越南文字集）。lang 由 dvSetLang／pdSetLang 設定。*/
    html[lang="vi"]{--ff:'Be Vietnam Pro','DM Sans',-apple-system,sans-serif;--fd:'Noto Serif','DM Serif Display',Georgia,serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ff);min-height:100vh}
    button,a{font:inherit}
    /* 🔴 以下的版面與元件刻意逐項照抄平台既有的兩個慣例，不要自己發明：
         · topbar（back 鈕／COMART 三角標／DM Serif 斜體名稱／.lchip 語言膠囊）
           照 admin・報價・board 的子系統慣例
         · 內容區（.home-wrap／.home-greeting／.section-title／.app-grid／.app-card）
           照 Portal index.html 的首頁
       v2.25 之前這裡是「行銷式大標 hero ＋ 280px 高的卡片 ＋ 進入…→ 連結」，
       顏色雖然統一了，版面語言仍然是另一套，一眼就看得出不是同一個系統。 */
    .topbar{height:56px;border-bottom:1px solid var(--br);background:rgba(17,24,39,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;gap:10px;padding:0 20px;position:sticky;top:0;z-index:100}
    #portal-back-btn{padding:5px 11px;border:1px solid var(--br);border-radius:var(--r);font-size:12px;color:var(--tx2);text-decoration:none;background:transparent;transition:all .15s;white-space:nowrap;margin-right:6px}
    #portal-back-btn:hover{color:var(--tx);border-color:var(--br2);background:var(--s2)}
    .logo{display:flex;align-items:center;gap:9px;text-decoration:none}
    .logo-mark{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .logo-text{font-family:var(--fd);font-style:italic;font-size:17px;color:var(--tx);letter-spacing:-.01em;white-space:nowrap}
    .logo-ver{font-family:var(--fm);font-size:11px;color:var(--tx3);opacity:.8;margin-left:6px;white-space:nowrap}
    .lchip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;border:1px solid var(--br);background:transparent;color:var(--tx3);cursor:pointer;transition:all .12s;white-space:nowrap}
    .lchip:hover{color:var(--tx);border-color:var(--br2)}
    .lchip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
    #langChips{display:flex;gap:4px;margin-left:auto;overflow:auto;-webkit-overflow-scrolling:touch}

    /* ── 內容區：與 Portal 首頁同一組尺寸 ── */
    .home-wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px;width:100%}
    .home-greeting{margin-bottom:24px}
    .home-hello{font-size:22px;font-weight:600}
    .home-sub{font-size:13px;color:var(--tx2);margin-top:3px}
    .section-title{font-size:11px;font-weight:600;color:var(--tx2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
    .app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:32px}
    .app-card{background:var(--s1);border:1px solid var(--br);border-radius:var(--rl);padding:18px;cursor:pointer;text-decoration:none;display:block;transition:all .18s;position:relative;overflow:hidden;color:var(--tx)}
    .app-card:hover{border-color:var(--ac);transform:translateY(-1px)}
    .app-card.locked{opacity:.45;cursor:not-allowed}
    .app-card.locked:hover{border-color:var(--br);transform:none}
    .app-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
    .app-name{font-size:14px;font-weight:600;margin-bottom:3px}
    .app-desc{font-size:11px;color:var(--tx2);line-height:1.5}
    .app-badge{position:absolute;top:10px;right:10px;background:var(--ac);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px}
    .app-badge.soon{background:var(--s3);color:var(--tx3)}
    .foot{margin-top:32px;padding-top:20px;border-top:1px solid var(--br);font-size:11px;color:var(--tx3);display:flex;justify-content:space-between;gap:16px}
    #error{display:none;margin-bottom:24px;padding:14px 16px;border:1px solid var(--red);background:var(--red2);color:var(--red);border-radius:var(--r);font-size:13px}
    @media(max-width:520px){.topbar{padding:0 14px}.home-wrap{padding:22px 16px 50px}.logo-text{font-size:15px}.foot{display:block;line-height:1.8}}
  </style>
</head>
<body>
  <header class="topbar">
    <a href="../index.html" id="portal-back-btn">← Portal</a>
    <a class="logo" href="../index.html">
      <div class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="302.53125 269.878906 47.6875 24.714844" width="26" height="14"><path fill="#ad0004" fill-rule="nonzero" d="M336.148438 294.59375 L326.378906 271.554688 L316.542969 294.59375 L302.53125 294.59375 L318.625 269.878906 L334.058594 269.878906 L350.21875 294.59375 Z"/><path fill="#ad0004" fill-rule="nonzero" d="M326.363281 283.351562 L321.265625 294.5625 L331.425781 294.5625 Z"/></svg></div>
      <div class="logo-text">COMART Product Dev<span class="logo-ver">v2.25</span></div>
    </a>
    <div id="langChips"></div>
  </header>
  <main class="home-wrap">
    <div class="home-greeting">
      <div class="home-hello" data-i18n="page_title">產品開發管理</div>
      <div class="home-sub" id="userLine" data-i18n="u_verifying">驗證中…</div>
    </div>
    <div id="error" data-i18n="err_session">登入資訊已失效。</div>
    <div class="section-title" data-i18n="sec_modules">Available modules</div>
    <div class="app-grid">
      <a class="app-card" href="#" id="finderCard">
        <div class="app-icon" style="background:#0A1A2E">🔍</div>
        <div class="app-name">Document Finder</div>
        <div class="app-desc" data-i18n="m_finder_d">分別搜尋自製品的設計圖、BOM 與 CAD。</div>
      </a>
      <a class="app-card" href="#" id="devicesCard">
        <div class="app-badge" data-i18n="tag_new">NEW</div>
        <div class="app-icon" style="background:#0A2A1A">📱</div>
        <div class="app-name" data-i18n="m_dev_t">手機與配件</div>
        <div class="app-desc" data-i18n="m_dev_d">查找公司設備、查看目前保管人。</div>
      </a>
      <div class="app-card locked">
        <div class="app-badge soon" data-i18n="tag_planned">PLANNED</div>
        <div class="app-icon" style="background:#1A0A1A">🗂</div>
        <div class="app-name">Project Pipeline</div>
        <div class="app-desc" data-i18n="m_pipe_d">開案需求、負責人、客戶節點。</div>
      </div>
      <div class="app-card locked">
        <div class="app-badge soon" data-i18n="tag_planned">PLANNED</div>
        <div class="app-icon" style="background:#1A1A08">🧪</div>
        <div class="app-name">Sample &amp; Tooling</div>
        <div class="app-desc" data-i18n="m_tool_d">樣品輪次、模具、測試認證。</div>
      </div>
    </div>
    <div class="foot"><span data-i18n="foot_note">Document Finder 使用獨立的命名空間。</span><span data-i18n="foot_use">COMART Internal Use</span></div>
  </main>
  <script>
    /* ═══ i18n ═══
       🔴 與其他五個系統共用 localStorage['comart-lang']，所以在 Portal 切語言，
          這裡下次載入就跟著換。值只有 en / zh-TW / zh-CN / vi / ja 五種。
       🔴 模組名稱刻意不翻：Document Finder／Project Pipeline／Sample & Tooling
          本來就是英文專名（同 COMART Platform／KMS）。只有「手機與配件」是中文
          取的名字，所以它有五語。 */
    const PD_LANGS=[['zh-TW','繁中'],['zh-CN','简中'],['en','EN'],['vi','VI'],['ja','日本語']];
    const PD_I18N={
      'zh-TW':{
        tag_new:'新增', tag_planned:'規劃中',
        page_title:'產品開發管理',
        u_logged_in:'目前登入：', u_verifying:'驗證中…',
        sec_modules:'可用模組',
        m_finder_d:'分別搜尋自製品的設計圖、BOM 與 CAD，以及外購品的型錄、報價單、簡報與產品圖。',
        m_dev_t:'手機與配件',
        m_dev_d:'查找公司設備、查看目前保管人，並處理借用、移轉、維修、退役與年度盤點。',
        m_pipe_d:'開案需求、負責人、客戶節點、風險與決策紀錄。保留給後續專案管理模組。',
        m_tool_d:'樣品輪次、模具、測試認證與中越供應鏈進度追蹤。',
        err_session:'登入資訊已失效。請返回 COMART Platform 重新登入。',
        role_admin:'管理員', role_dcc:'編輯者', role_user:'查詢者',
        foot_note:'Document Finder 使用獨立的 pd_mfg_／pd_buy_ 命名空間，不改寫既有的 KMS 或報價資料。',
        foot_use:'COMART 內部使用'
      },
      'zh-CN':{
        tag_new:'新增', tag_planned:'规划中',
        page_title:'产品开发管理',
        u_logged_in:'目前登录：', u_verifying:'验证中…',
        sec_modules:'可用模块',
        m_finder_d:'分别搜索自制品的设计图、BOM 与 CAD，以及外购品的型录、报价单、简报与产品图。',
        m_dev_t:'手机与配件',
        m_dev_d:'查找公司设备、查看目前保管人，并处理借用、移转、维修、退役与年度盘点。',
        m_pipe_d:'开案需求、负责人、客户节点、风险与决策记录。保留给后续项目管理模块。',
        m_tool_d:'样品轮次、模具、测试认证与中越供应链进度追踪。',
        err_session:'登录信息已失效。请返回 COMART Platform 重新登录。',
        role_admin:'管理员', role_dcc:'编辑者', role_user:'查询者',
        foot_note:'Document Finder 使用独立的 pd_mfg_／pd_buy_ 命名空间，不改写既有的 KMS 或报价数据。',
        foot_use:'COMART 内部使用'
      },
      en:{
        tag_new:'NEW', tag_planned:'PLANNED',
        page_title:'Product Development',
        u_logged_in:'Signed in as ', u_verifying:'Verifying…',
        sec_modules:'Available modules',
        m_finder_d:'Search drawings, BOMs and CAD for in-house items, and catalogues, quotations, decks and product photos for purchased items — kept apart.',
        m_dev_t:'Device Custody',
        m_dev_d:'Find company devices, see who currently holds them, and handle borrowing, transfers, repairs, retirement and the annual stocktake.',
        m_pipe_d:'Kickoff requirements, owners, customer milestones, risks and decision records. Reserved for the upcoming project management module.',
        m_tool_d:'Sample rounds, tooling, test certification and supply-chain progress across Taiwan, Dongguan and Vietnam.',
        err_session:'Your session is no longer valid. Please return to COMART Platform and sign in again.',
        role_admin:'Administrator', role_dcc:'Editor', role_user:'Viewer',
        foot_note:'Document Finder uses its own pd_mfg_ / pd_buy_ namespace and does not touch existing KMS or Quotation data.',
        foot_use:'COMART Internal Use'
      },
      vi:{
        tag_new:'MỚI', tag_planned:'DỰ KIẾN',
        page_title:'Quản lý phát triển sản phẩm',
        u_logged_in:'Đang đăng nhập: ', u_verifying:'Đang xác minh…',
        sec_modules:'Mô-đun khả dụng',
        m_finder_d:'Tìm bản vẽ, BOM và CAD của hàng tự sản xuất, cùng catalogue, báo giá, bản trình bày và ảnh sản phẩm của hàng mua ngoài — hoàn toàn tách biệt.',
        m_dev_t:'Quản lý thiết bị',
        m_dev_d:'Tra cứu thiết bị công ty, xem ai đang giữ, và xử lý mượn, chuyển giao, sửa chữa, thanh lý và kiểm kê hằng năm.',
        m_pipe_d:'Yêu cầu mở dự án, người phụ trách, mốc với khách hàng, rủi ro và hồ sơ quyết định. Dành cho mô-đun quản lý dự án sắp tới.',
        m_tool_d:'Các vòng làm mẫu, khuôn, chứng nhận kiểm định và tiến độ chuỗi cung ứng Đài Loan – Đông Quản – Việt Nam.',
        err_session:'Phiên đăng nhập không còn hiệu lực. Vui lòng quay lại COMART Platform và đăng nhập lại.',
        role_admin:'Quản trị viên', role_dcc:'Biên tập viên', role_user:'Người xem',
        foot_note:'Document Finder dùng không gian tên riêng pd_mfg_ / pd_buy_, không ảnh hưởng dữ liệu KMS hay báo giá hiện có.',
        foot_use:'Sử dụng nội bộ COMART'
      },
      ja:{
        tag_new:'新規', tag_planned:'予定',
        page_title:'製品開発管理',
        u_logged_in:'ログイン中：', u_verifying:'確認中…',
        sec_modules:'利用可能なモジュール',
        m_finder_d:'自社製品の図面・BOM・CAD と、外部購入品のカタログ・見積書・資料・製品画像を、それぞれ分けて検索します。',
        m_dev_t:'携帯電話と周辺機器',
        m_dev_d:'社内機器の検索、現在の保管者の確認、貸出・移管・修理・廃棄・年次棚卸の処理を行います。',
        m_pipe_d:'案件要件、担当者、顧客マイルストーン、リスクと意思決定の記録。今後のプロジェクト管理モジュール用です。',
        m_tool_d:'試作ラウンド、金型、試験認証、および台湾・東莞・ベトナムのサプライチェーン進捗の追跡。',
        err_session:'ログイン情報が無効になりました。COMART Platform に戻って再ログインしてください。',
        role_admin:'管理者', role_dcc:'編集者', role_user:'閲覧者',
        foot_note:'Document Finder は独自の pd_mfg_ / pd_buy_ 名前空間を使用し、既存の KMS や見積データには影響しません。',
        foot_use:'COMART 社内利用'
      }
    };
    let PDLANG='zh-TW';
    function PT(k){ return (PD_I18N[PDLANG]||PD_I18N['zh-TW'])[k] || PD_I18N['zh-TW'][k] || k; }
    function pdInitLang(sess){
      let l=''; try{ l=localStorage.getItem('comart-lang')||''; }catch(_){}
      // 沒設定過就依所屬中心猜一次（同 board bInitLang）：台灣繁中、東莞簡中、越南越南文
      if(!PD_I18N[l]) l=({TW:'zh-TW',CN:'zh-CN',VN:'vi'})[sess&&sess.site]||'zh-TW';
      PDLANG=l; document.documentElement.lang=l;
    }
    function pdSetLang(l){
      if(!PD_I18N[l]||l===PDLANG) return;
      PDLANG=l;
      try{ localStorage.setItem('comart-lang',l); }catch(_){}   // 與 Portal 共用同一把鑰匙
      document.documentElement.lang=l;
      pdApplyI18n();
    }
    function pdApplyI18n(){
      document.querySelectorAll('[data-i18n]').forEach(function(e){ e.textContent=PT(e.getAttribute('data-i18n')); });
      var box=document.getElementById('langChips');
      if(box){
        box.innerHTML=PD_LANGS.map(function(l){
          return '<button class="lchip'+(l[0]===PDLANG?' on':'')+'" onclick="pdSetLang(\''+l[0]+'\')">'+l[1]+'</button>';
        }).join('');
        var on=box.querySelector('.lchip.on');
        if(on){ try{ on.scrollIntoView({block:'nearest',inline:'nearest'}); }catch(_){} }
      }
      // 登入者那一行照 Portal 首頁的 greetSub：姓名是資料、角色標籤才隨語言換
      var ul=document.getElementById('userLine');
      if(ul&&window._pdSess){
        ul.removeAttribute('data-i18n');
        ul.textContent=PT('u_logged_in')+(_pdSess.nameZh||_pdSess.nameEn||_pdSess.empId)+' · '
          +PT(_pdSess.role==='admin'?'role_admin':_pdSess.role==='dcc'?'role_dcc':'role_user')
          +' · '+_pdSess.empId;
      }
    }
    const KEY='comart-portal-session';
    function decode(v){try{return JSON.parse(decodeURIComponent(escape(atob(v))))}catch(_){return null}}
    const q=new URLSearchParams(location.search);
    let s=q.get('_ps')?decode(q.get('_ps')):null;
    if(s&&s.empId&&s.sig){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(_){}}
    if(!s){try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(_){}}
    const valid=s&&s.empId&&s.sig&&(!s.expires||Date.now()<s.expires);
    if(!valid){document.getElementById('error').style.display='block';document.getElementById('finderCard').classList.add('locked');document.getElementById('devicesCard').classList.add('locked');}
    else{
      window._pdSess=s;
      document.getElementById('finderCard').onclick=function(e){
        e.preventDefault();
        const token=btoa(unescape(encodeURIComponent(JSON.stringify(s))));
        location.href='./finder/index.html?_portal=1&_ps='+encodeURIComponent(token);
      };
      document.getElementById('devicesCard').onclick=function(e){
        e.preventDefault();
        const token=btoa(unescape(encodeURIComponent(JSON.stringify(s))));
        location.href='./devices/index.html?_ps='+encodeURIComponent(token);
      };
    }
    if(q.has('_ps'))history.replaceState(null,'',location.pathname);
    pdInitLang(s);
    pdApplyI18n();
  </script>
</body>
</html>
